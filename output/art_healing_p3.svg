<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .main-text { font-family: 'PingFang SC', sans-serif; fill: #111111; }
            .accent-text { font-family: 'PingFang SC', sans-serif; fill: #20C997; } /* Updated accent color */
            .eng-text { font-family: 'Arial', sans-serif; fill: #111111; }
            .bg-white { fill: #FFFFFF; }
            .line-stroke { stroke: #111111; stroke-width: 2; }
            .placeholder-rect { fill: none; stroke: #AAAAAA; stroke-width: 1; stroke-dasharray: 4 2; }
            .placeholder-text { font-family: 'PingFang SC', sans-serif; font-size: 18; fill: #AAAAAA; }
        </style>
    </defs>

    <rect width="600" height="800" class="bg-white"/>

    <!-- Column Header -->
    <text x="300" y="40" text-anchor="middle" font-size="20" class="eng-text">RESIDENT ARTIST LOG</text>
    <line x1="150" y1="50" x2="450" y2="50" class="line-stroke"/>

    <!-- P3 Title -->
    <text x="300" y="100" text-anchor="middle" font-size="28" font-weight="bold" class="main-text">当画笔触及潜意识：一场通往内在的温柔远征</text>

    <!-- Content Text -->
    <g class="main-text" font-size="22">
        <text x="50" y="160">艺术，是疗愈最温柔的介质。而“画到万物都消失”的</text>
        <text x="50" y="190">过程，正是我们与潜意识对话、进行自我整合的绝佳</text>
        <text x="50" y="220">方式。它并非要你技巧精湛，而是鼓励你：</text>
        <text x="50" y="250">1. <tspan font-weight="bold" fill="#20C997">放下掌控</tspan>：允许颜料流动，形状模糊，直到熟悉的</text> <!-- Accent color applied -->
        <text x="50" y="280">   世界在画布上消融。</text>
        <text x="50" y="310">2. <tspan font-weight="bold" fill="#20C997">清空心智</tspan>：当一切外物被“画掉”，内心得以清</text> <!-- Accent color applied -->
        <text x="50" y="340">   空，杂念减少，真正的自我开始浮现。</text>
        <text x="50" y="370">3. <tspan font-weight="bold" fill="#20C997">情感具象</tspan>：那些难以言说的“爱与被爱”，或被压</text> <!-- Accent color applied -->
        <text x="50" y="400">   抑的“心轮情感”，通过色彩与线条具象化，得到</text>
        <text x="50" y="430">   释放与整合。</text>
        <text x="50" y="460">4. <tspan font-weight="bold" fill="#20C997">新生与复苏</tspan>：在“消失”之后，新的形状、色彩和</text> <!-- Accent color applied -->
        <text x="50" y="490">   意义自然“复生”，这是内在平衡重建，心轮修复的</text>
        <text x="50" y="520">   过程。</text>
    </g>

    <!-- Image Placeholder (Model/Diagram) -->
    <rect x="100" y="560" width="400" height="150" class="placeholder-rect"/>
    <text x="300" y="635" text-anchor="middle" class="placeholder-text">📷 建议放：抽象画作局部特写，色彩斑斓却又透着平静，或一只手握着画笔在空白画布上。</text>
    
    <!-- Footer -->
    <text x="550" y="770" text-anchor="end" font-size="18" class="main-text">03 / 05</text>
</svg>
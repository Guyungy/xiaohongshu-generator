<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Page Number -->
  <text x="1020" y="100" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">02/04</text>
  
  <!-- Title Section -->
  <text x="60" y="180" fill="#333333" font-family="PingFang SC, sans-serif" font-size="64" font-weight="bold">01. 教育的“开盲盒”</text>
  
  <!-- Main Image with "Stickers" -->
  <rect x="60" y="240" width="960" height="500" fill="#E0DCD9"/>
  <text x="540" y="490" fill="#999999" font-family="PingFang SC, sans-serif" font-size="32" text-anchor="middle">Image: Students exploring local culture</text>
  
  <!-- Stickers -->
  <g transform="rotate(-5, 900, 450)">
    <rect x="800" y="420" width="160" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="880" y="460" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">行走</text>
  </g>
  
  <g transform="rotate(5, 120, 300)">
    <rect x="60" y="270" width="160" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="140" y="310" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">看见</text>
  </g>

  <!-- Body Text -->
  <text x="60" y="800" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" line-spacing="10">
      <tspan x="60" dy="0">这是“中国教室”最迷人的时刻。</tspan>
      <tspan x="60" dy="60">课本上的文字走出纸张，变成脚下的土地。</tspan>
      <tspan x="60" dy="60">经过跋涉、触摸、感知、对话，</tspan>
      <tspan x="60" dy="60">最后被送进记忆的深处。</tspan>
      <tspan x="60" dy="90">没人知道结果会怎样。</tspan>
      <tspan x="60" dy="50">可能会疲惫，随色可能会流淌出意想不到的感悟。</tspan>
  </text>
  
  <!-- Bottom Box (The Insight) -->
  <rect x="60" y="1150" width="960" height="200" fill="none" stroke="#B45B3E" stroke-width="2"/>
  
  <!-- Icon in box -->
  <text x="100" y="1220" font-size="40">💡</text>
  <text x="160" y="1220" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">这里的教育隐喻：</text>
  
  <text x="100" y="1280" fill="#666666" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">
      <tspan x="100" dy="0">在这个急功近利的时代，</tspan>
      <tspan x="100" dy="50">耀华在教孩子“学会等待”和“接受真实”。</tspan>
  </text>

</svg>

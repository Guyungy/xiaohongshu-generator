<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Page Number -->
  <text x="1020" y="100" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">03/04</text>
  
  <!-- Title Section -->
  <text x="60" y="180" fill="#333333" font-family="PingFang SC, sans-serif" font-size="64" font-weight="bold">02. 走马观花 vs 深度研习</text>
  
  <!-- Comparison Cards Area -->
  <rect x="60" y="280" width="960" height="400" fill="#F0EBE8"/> <!-- Subtle bg for card area -->
  
  <!-- Left Card: Ordinary Tourism -->
  <rect x="110" y="330" width="400" height="300" fill="#FFFFFF"/>
  <text x="310" y="400" font-size="60" text-anchor="middle">📷</text> <!-- Diamond equivalent -->
  <text x="310" y="460" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">普通旅游</text>
  <text x="310" y="520" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">拍照、打卡、</text>
  <text x="310" y="560" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">到此一游</text>
  
  <!-- Right Card: Yew Wah Study Tour -->
  <rect x="570" y="330" width="400" height="300" fill="#EAE0DA"/> <!-- Slightly darker/warmer -->
  <text x="770" y="400" font-size="60" text-anchor="middle">🏺</text> <!-- Pottery equivalent -->
  <text x="770" y="460" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">中国教室</text>
  <text x="770" y="520" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">沉浸、探究、</text>
  <text x="770" y="560" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">与土地深度连接</text>

  <!-- Body Text -->
  <text x="60" y="800" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" line-spacing="10">
      <tspan x="60" dy="0">普通旅游像是看风景，</tspan>
      <tspan x="60" dy="50">每一步都安排好，容不得半点意外。</tspan>
      <tspan x="60" dy="70">但在<tspan fill="#B45B3E" font-weight="bold">上海耀中耀华</tspan>的“中国教室”，</tspan>
      <tspan x="60" dy="50">我看到的是“陶土式”的教育。</tspan>
  </text>
  
  <!-- Bottom Quote Lines -->
  <line x1="60" y1="1100" x2="1020" y2="1100" stroke="#E0DCD9" stroke-width="2"/>
  <text x="60" y="1180" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="36" font-weight="bold">“给孩子泥土，让他自己去感知形状；”</text>
  <text x="60" y="1250" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="36" font-weight="bold">“给孩子挑战，让他自己去经历淬炼。”</text>

</svg>

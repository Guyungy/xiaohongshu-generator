<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Value | 该怎么做</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">把“微距观察”带回家</text>
  <text x="80" y="310" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#666666">三个游戏训练孩子的“定力”</text>
  
  <!-- Tips List -->
  <g transform="translate(80, 360)">
    
    <!-- Tip 1 -->
    <rect x="0" y="0" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="80" r="40" fill="#FF4500"/>
    <text x="80" y="95" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">1</text>
    
    <text x="160" y="70" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">取景框游戏</text>
    <text x="160" y="130" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">用手指比成一个方框，只看花蕊中心。</text>
    <text x="160" y="170" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">当视野被限制，细节就会被放大。</text>
    <text x="160" y="210" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 屏蔽干扰，物理聚焦。</text>

    <!-- Tip 2 -->
    <rect x="0" y="310" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="380" r="40" fill="black"/>
    <text x="80" y="395" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">2</text>
    
    <text x="160" y="360" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">禁止说出名字</text>
    <text x="160" y="420" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">不准说“这是玫瑰”。</text>
    <text x="160" y="460" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">试着描述：“花瓣像揉皱的丝绸...”</text>
    <text x="160" y="500" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 剥离标签，回归感知。</text>

    <!-- Tip 3 -->
    <rect x="0" y="620" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="690" r="40" fill="white" stroke="black" stroke-width="4"/>
    <text x="80" y="705" font-family="Arial, sans-serif" font-size="48" fill="black" text-anchor="middle" font-weight="bold">3</text>
    
    <text x="160" y="670" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">画出“看不见”的东西</text>
    <text x="160" y="730" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">画出花的“味道”，画出“温度”。</text>
    <text x="160" y="770" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">调动通感，让观察延伸到全身。</text>
    <text x="160" y="810" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 全身心投入，深度沉浸。</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">5 / 6</text>
</svg>

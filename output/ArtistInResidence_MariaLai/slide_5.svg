<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Value | 该怎么做</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">如何呵护孩子的“那根线”？</text>
  <text x="80" y="310" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#666666">给家长的三个具体建议</text>
  
  <!-- Tips List -->
  <g transform="translate(80, 360)">
    
    <!-- Tip 1 -->
    <rect x="0" y="0" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="80" r="40" fill="#FF4500"/>
    <text x="80" y="95" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">1</text>
    
    <text x="160" y="70" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">别只夸“画得真像”</text>
    <text x="160" y="130" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">当孩子画了一团乱麻，试着问：</text>
    <text x="160" y="170" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">“这根调皮的线条要去哪里旅行？”</text>
    <text x="160" y="210" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">“这两个颜色撞在一起，是在说悄悄话吗？”</text>
    <text x="160" y="240" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 引导关注创作意图，而非仅仅是视觉结果。</text>

    <!-- Tip 2 -->
    <rect x="0" y="310" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="380" r="40" fill="black"/>
    <text x="80" y="395" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">2</text>
    
    <text x="160" y="360" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">允许“乱缠乱绕”的权利</text>
    <text x="160" y="420" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">给孩子一团毛线，允许他把家里的椅子腿</text>
    <text x="160" y="460" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">和桌子腿连起来，构建一个“激光阵”。</text>
    <text x="160" y="500" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">这是空间构建能力的萌芽，更是他在建立安全感。</text>
    <text x="160" y="530" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 混乱往往是创造力最肥沃的温床。</text>

    <!-- Tip 3 -->
    <rect x="0" y="620" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="690" r="40" fill="white" stroke="black" stroke-width="4"/>
    <text x="80" y="705" font-family="Arial, sans-serif" font-size="48" fill="black" text-anchor="middle" font-weight="bold">3</text>
    
    <text x="160" y="670" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">寻找生活的隐喻</text>
    <text x="160" y="730" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">像Maria Lai一样，引导孩子去发现生活中的“线”：</text>
    <text x="160" y="770" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">每天放学回家的路是一根线，</text>
    <text x="160" y="810" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">给远方的外婆打电话是一根看不见的线。</text>
    <text x="160" y="840" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">→ 艺术思维，就是看见那些看不见的联系。</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">5 / 6</text>
</svg>

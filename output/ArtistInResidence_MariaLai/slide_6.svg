<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Conclusion | 结语</text>
  
  <!-- Big Quote Mark -->
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="200" fill="#FF4500" opacity="0.2">“</text>
  
  <!-- Quote Text -->
  <text x="150" y="350" font-family="Noto Sans SC, sans-serif" font-size="56" fill="black" font-weight="bold">我牵着一根线，</text>
  <text x="150" y="450" font-family="Noto Sans SC, sans-serif" font-size="56" fill="black" font-weight="bold">是为了从焦虑的迷宫里</text>
  <text x="150" y="550" font-family="Noto Sans SC, sans-serif" font-size="56" fill="black" font-weight="bold">走出来。</text>
  
  <text x="600" y="650" font-family="Noto Sans SC, sans-serif" font-size="36" fill="#333333">— Maria Lai</text>
  
  <!-- Labyrinth Visual -->
  <g transform="translate(290, 800)">
    <!-- A Labyrinth Path -->
    <path d="M50 50 H450 V450 H50 V100 H400 V400 H100 V150 H350 V350 H150 V200 H300" 
          stroke="black" stroke-width="3" fill="none"/>
          
    <!-- The Thread leading out -->
    <path d="M250 275 L250 250" stroke="#FF4500" stroke-width="6"/> <!-- Start Center -->
    <path d="M250 250 L 300 250 ... " stroke="none"/> <!-- Just a conceptual thread -->
    
    <!-- Simplified Thread Path overlaying the maze to show 'exit' -->
    <path d="M250 275 L250 300 L200 300 L200 150 L350 150 L350 350 L100 350 L100 500" 
          stroke="#FF4500" stroke-width="4" stroke-dasharray="10 10"/>
    <text x="80" y="550" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#FF4500">Find your thread</text>
  </g>

  <!-- Final Call to Action -->
  <text x="540" y="1250" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle">愿我们的孩子，</text>
  <text x="540" y="1300" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle" font-weight="bold">手中永远握着那根“线”。</text>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">驻校艺术家手记 @ 上海耀中耀华</text>
  <text x="1000" y="1390" font-family="Arial, sans-serif" font-size="24" fill="black" text-anchor="end">2026.01</text>
</svg>

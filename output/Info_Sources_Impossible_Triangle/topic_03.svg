<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#0F1419"/>
  <path d="M0 240 L1080 240" stroke="#334155" stroke-width="4"/>
  
  <!-- Series Header -->
  <text x="60" y="100" fill="#94A3B8" font-family="PingFang SC, sans-serif" font-weight="bold" font-size="32">P03 // THE ALGORITHM</text>
  <text x="60" y="180" fill="#FFFFFF" font-family="PingFang SC, sans-serif" font-weight="900" font-size="72">建立你的「动态奖惩」过滤网</text>
  
  <!-- Intro Text -->
  <text x="60" y="320" fill="#E2E8F0" font-family="PingFang SC, sans-serif" font-size="36">
    <tspan x="60" dy="0">既然完美信源不存在，</tspan>
    <tspan x="60" dy="50">我们就需要一套算法来管理它们。</tspan>
  </text>

  <!-- The Code Block -->
  <rect x="60" y="400" width="960" height="760" rx="24" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Reward Section -->
  <rect x="100" y="440" width="880" height="300" rx="16" fill="#111827"/>
  <text x="140" y="500" fill="#10B981" font-family="PingFang SC, sans-serif" font-weight="bold" font-size="40">+++ 奖励机制 (Reward)</text>
  <line x1="140" y1="530" x2="940" y2="530" stroke="#374151" stroke-width="2"/>
  
  <text x="140" y="600" fill="#E2E8F0" font-family="PingFang SC, sans-serif" font-size="32">IF (他能提供 **增量解读** || **新信息 High**):</text>
  <text x="140" y="660" fill="#10B981" font-family="Menlo, monospace" font-weight="bold" font-size="36">-> Weight++ (增加权重/置顶)</text>

  <!-- Punishment Section -->
  <rect x="100" y="780" width="880" height="340" rx="16" fill="#111827"/>
  <text x="140" y="840" fill="#EF4444" font-family="PingFang SC, sans-serif" font-weight="bold" font-size="40">--- 惩罚机制 (Punish)</text>
  <line x1="140" y1="870" x2="940" y2="870" stroke="#374151" stroke-width="2"/>
  
  <text x="140" y="940" fill="#E2E8F0" font-family="PingFang SC, sans-serif" font-size="32">IF (他开始 **炒冷饭** || **信息密度 Low**):</text>
  <text x="140" y="1000" fill="#EF4444" font-family="Menlo, monospace" font-weight="bold" font-size="36">-> Weight -= 50 (极速降权)</text>
  
  <rect x="140" y="1050" width="800" height="40" rx="4" fill="#7F1D1D" fill-opacity="0.3"/>
  <text x="160" y="1080" fill="#FCA5A5" font-family="PingFang SC, sans-serif" font-size="24"># 注：即便炒冷饭对别人是新知，对我也是浪费时间。</text>

  <!-- Conclusion -->
  <rect x="60" y="1220" width="6" height="80" fill="#1D9BF0"/>
  <text x="90" y="1255" fill="#FFFFFF" font-family="PingFang SC, sans-serif" font-weight="bold" font-size="40">Punish the Noise. Reward the Signal.</text>
  <text x="90" y="1295" fill="#94A3B8" font-family="PingFang SC, sans-serif" font-size="32">像运维服务器一样运维你的关注列表。</text>

  <!-- Pagination -->
  <text x="960" y="1380" fill="#64748B" font-family="Menlo, monospace" font-size="24">03/04</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1440" fill="white"/>
<rect x="50" y="50" width="980" height="1340" stroke="black" stroke-width="2"/>

<!-- Header -->
<text x="80" y="100" font-family="sans-serif" font-size="36" font-weight="bold" fill="black">带娃看《吉赛尔》的4个深度TIPS</text>
<text x="80" y="150" font-family="sans-serif" font-size="24" fill="#555">艺术妈妈收藏级</text>
<line x1="80" y1="170" x2="1000" y2="170" stroke="#FF4500" stroke-width="2"/>

<!-- Tip 1 -->
<text x="80" y="230" font-family="monospace" font-size="32" fill="#FF4500">1. </text>
<text x="120" y="230" font-family="sans-serif" font-size="32" font-weight="bold" fill="black">8岁以上再看第二幕</text>
<text x="120" y="270" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">第二幕“亡灵之舞”场景发生在夜晚墓地，对低龄孩子有一定冲击。建议8岁以上，心智</text>
<text x="120" y="300" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">更成熟些再完整欣赏。可提前告知“这是关于原谅的很美故事”，帮孩子建立心理预期，</text>
<text x="120" y="330" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">引导他们更多关注舞蹈本身的美感，而非情节的悲伤。</text>
<line x1="80" y1="380" x2="1000" y2="380" stroke="black" stroke-width="0.5" stroke-dasharray="2 2"/>

<!-- Tip 2 -->
<text x="80" y="430" font-family="monospace" font-size="32" fill="#FF4500">2. </text>
<text x="120" y="430" font-family="sans-serif" font-size="32" font-weight="bold" fill="black">从温暖到纵深</text>
<text x="120" y="470" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">可以分两次看。先欣赏第一幕，聚焦田园诗般的爱情与多彩乡村舞蹈，感受吉赛尔的</text>
<text x="120" y="500" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">天真烂漫。熟悉人物和故事后，再进入第二幕，探讨背叛、死亡与宽恕的深刻主题。</text>
<text x="120" y="530" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">这种过渡能让孩子更好地理解人物的转变和情感的复杂性。</text>
<line x1="80" y1="580" x2="1000" y2="580" stroke="black" stroke-width="0.5" stroke-dasharray="2 2"/>

<!-- Tip 3 -->
<text x="80" y="630" font-family="monospace" font-size="32" fill="#FF4500">3. </text>
<text x="120" y="630" font-family="sans-serif" font-size="32" font-weight="bold" fill="black">创作“月光幽灵”</text>
<text x="120" y="670" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">艺术是最好的内化方式。观后，和孩子一起用白色水彩、盐和银色闪粉创作“月光下</text>
<text x="120" y="700" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">的Wilis”。过程中可以聊：“你觉得Wilis的裙子是什么样的？”“她为什么看起来那么</text>
<text x="120" y="730" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">悲伤又那么轻盈？”让抽象的感受通过创作具体化。</text>
<line x1="80" y1="780" x2="1000" y2="780" stroke="black" stroke-width="0.5" stroke-dasharray="2 2"/>

<!-- Tip 4 -->
<text x="80" y="830" font-family="monospace" font-size="32" fill="#FF4500">4. </text>
<text x="120" y="830" font-family="sans-serif" font-size="32" font-weight="bold" fill="black">云端剧院，反复品味</text>
<text x="120" y="870" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">利用好线上资源。英国皇家芭蕾舞团、巴黎歌剧院芭蕾舞团等都有经典《吉赛尔》</text>
<text x="120" y="900" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">的高清影像。在家观看的好处是可以随时暂停、回放，定格欣赏经典舞段，甚至可以</text>
<text x="120" y="930" font-family="sans-serif" font-size="26" fill="#333" xml:space="preserve">分角色模仿，在轻松氛围中完成艺术启蒙。</text>

<!-- Decorative Visual: Paintbrush and sparkles -->
<g id="visual" transform="translate(540, 1100)">
    <!-- Paintbrush -->
    <path d="M -100 0 L 100 0 L 100 50 L -100 50 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M -100 0 L -120 -50 L -80 -50 Z" stroke="black" stroke-width="1.5" fill="none" />
    <path d="M -110 -10 L -115 -40" stroke="black" stroke-width="1" />
    <path d="M -100 -10 L -105 -40" stroke="black" stroke-width="1" />
    <path d="M -90 -10 L -95 -40" stroke="black" stroke-width="1" />
    <!-- Sparkles -->
    <g fill="#FF4500">
        <path d="M 150 0 L 155 10 L 165 15 L 155 20 L 150 30 L 145 20 L 135 15 L 145 10 Z"/>
        <path d="M 200 -50 L 203 -40 L 210 -37 L 203 -34 L 200 -24 L 197 -34 L 190 -37 L 197 -40 Z"/>
        <path d="M 50 -80 L 52 -72 L 58 -70 L 52 -68 L 50 -60 L 48 -68 L 42 -70 L 48 -72 Z" opacity="0.6"/>
    </g>
</g>


<!-- Footer -->
<text x="540" y="1320" font-family="monospace" font-size="24" fill="black" text-anchor="middle">...</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1440" fill="white"/>
<rect x="50" y="50" width="980" height="1340" stroke="black" stroke-width="2"/>

<!-- Main Quote -->
<text x="540" y="250" font-family="serif" font-size="48" fill="black" text-anchor="middle">爱有时很残酷，</text>
<text x="540" y="320" font-family="serif" font-size="48" fill="black" text-anchor="middle">但它也能化作</text>
<text x="540" y="420" font-family="serif" font-size="60" font-weight="bold" fill="#FF4500" text-anchor="middle">最美的力量。</text>
<line x1="240" y1="450" x2="840" y2="450" stroke="black" stroke-width="1.5" />


<!-- Engagement Questions -->
<text x="80" y="550" font-family="sans-serif" font-size="30" fill="#333" xml:space="preserve">姐妹们，你们看过《吉赛尔》吗？</text>
<text x="80" y="600" font-family="sans-serif" font-size="30" fill="#333" xml:space="preserve">第二幕的Wilis有没有让你心碎又起鸡皮？</text>

<rect x="80" y="660" width="900" height="2" fill="#FF4500" opacity="0.5"/>

<text x="80" y="720" font-family="sans-serif" font-size="30" fill="#333" xml:space="preserve">最戳你的瞬间是哪一刻？</text>
<text x="80" y="770" font-family="sans-serif" font-size="30" fill="#333" xml:space="preserve">有没有其他浪漫芭蕾适合带娃入门？</text>

<!-- Call to Action -->
<g id="cta" text-anchor="middle">
    <rect x="240" y="950" width="600" height="150" fill="none" stroke="black" stroke-width="1" stroke-dasharray="10 5"/>
    <text x="540" y="1010" font-family="sans-serif" font-size="32" font-weight="bold" fill="black">评论区来分享你的感受</text>
    <text x="540" y="1060" font-family="sans-serif" font-size="28" fill="#FF4500">我会一一回复哦 ❤️</text>
</g>

<!-- Signature -->
<text x="540" y="1200" font-family="monospace" font-size="28" fill="black" text-anchor="middle">驻校艺术家</text>

<!-- End Mark -->
<rect x="535" y="1250" width="10" height="10" fill="black" />

</svg>

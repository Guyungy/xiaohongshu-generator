<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1440" fill="#F7F9F9"/>
  <!-- Header -->
  <rect x="60" y="60" width="8" height="70" fill="#F4245E"/>
  <text x="90" y="110" fill="#0F1419" font-family="sans-serif" font-weight="bold" font-size="56">大厂模式 vs AI 杠杆</text>

  <!-- Section 1: The Trap of Efficiency -->
  <text x="60" y="200" fill="#F4245E" font-family="sans-serif" font-weight="bold" font-size="42">❌ 大厂的“高强度压缩”</text>
  <rect x="60" y="230" width="960" height="420" rx="16" fill="white" stroke="#E1E8ED" stroke-width="2"/>
  
  <text x="100" y="290" fill="#0F1419" font-family="sans-serif" font-size="30">
    <tspan x="100" dy="0" font-weight="bold">3x8=24 年经验：</tspan>
    <tspan x="100" dy="45">在字节 3 年，工作密度相当于别人的 8 年。</tspan>
    
    <tspan x="100" dy="70" font-weight="bold">无效内卷：</tspan>
    <tspan x="100" dy="45">巅峰期一天处理 1000+ 条消息，时间消耗在“对齐”、</tspan>
    <tspan x="100" dy="45">“拉通”上。</tspan>

    <tspan x="100" dy="70" font-weight="bold">系统性异化：</tspan>
    <tspan x="100" dy="45">变成精密系统中的螺丝钉，离开平台可能什么都不是。</tspan>
  </text>

  <!-- Arrow Indicator -->
  <path d="M540,670 L540,710" stroke="#0F1419" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0F1419" />
    </marker>
  </defs>

  <!-- Section 2: The Freedom of AI -->
  <text x="60" y="760" fill="#1D9BF0" font-family="sans-serif" font-weight="bold" font-size="42">✅ AI 带来的“无限杠杆”</text>
  <rect x="60" y="790" width="960" height="420" rx="16" fill="#E8F5FD" stroke="#1D9BF0" stroke-width="2"/>
  
  <text x="100" y="850" fill="#0F1419" font-family="sans-serif" font-size="30">
    <tspan x="100" dy="0" font-weight="bold">能力边界扩张：</tspan>
    <tspan x="100" dy="45">从前我只能写代码，现在我能做设计、做视频。</tspan>
    <tspan x="100" dy="45">AI 补齐了短板。</tspan>

    <tspan x="100" dy="70" font-weight="bold">目标函数重构：</tspan>
    <tspan x="100" dy="45">不再为了 KPI，目标函数是“幸福感”和“创造力”。</tspan>

    <tspan x="100" dy="70" font-weight="bold">只做核心：</tspan>
    <tspan x="100" dy="45">把重复性工作丢给 AI，只保留核心决策。</tspan>
  </text>

  <!-- Quote -->
  <text x="540" y="1300" fill="#536471" font-family="sans-serif" font-style="italic" font-size="32" text-anchor="middle">"AI 不是工具，它是你肢体的延伸。"</text>

  <!-- Page Number -->
  <circle cx="540" cy="1380" r="24" fill="#CFD9DE"/>
  <text x="540" y="1390" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">3</text>
</svg>

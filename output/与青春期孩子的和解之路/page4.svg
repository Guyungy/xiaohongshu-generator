<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Page Number -->
  <text x="1020" y="100" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">04/05</text>
  
  <!-- Title Section -->
  <text x="60" y="180" fill="#333333" font-family="PingFang SC, sans-serif" font-size="64" font-weight="bold">03. 把目光收回自己身上</text>
  
  <!-- Main Image with "Stickers" -->
  <rect x="60" y="240" width="960" height="500" fill="#E0DCD9"/>
  <text x="540" y="490" fill="#999999" font-family="PingFang SC, sans-serif" font-size="32" text-anchor="middle">Image: Mother reading book / Enjoying life</text>
  
  <!-- Stickers -->
  <g transform="rotate(-3, 850, 680)">
    <rect x="750" y="650" width="180" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="840" y="690" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">自我关怀</text>
  </g>
  
  <g transform="rotate(2, 120, 300)">
    <rect x="60" y="270" width="160" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="140" y="310" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">松弛感</text>
  </g>

  <!-- Body Text -->
  <text x="60" y="800" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" line-spacing="10">
      <tspan x="60" dy="0">最好的教育，不是时刻盯着孩子，</tspan>
      <tspan x="60" dy="60">而是活出自己想要的样子。</tspan>
      <tspan x="60" dy="60">当你有了属于自己的光芒，</tspan>
      <tspan x="60" dy="60">孩子自然会追光而来。</tspan>
  </text>
  
  <!-- Bottom Box (The Insight) -->
  <rect x="60" y="1150" width="960" height="200" fill="none" stroke="#B45B3E" stroke-width="2"/>
  
  <!-- Icon in box -->
  <text x="100" y="1220" font-size="40">☕</text>
  <text x="160" y="1220" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">给父母的建议：</text>
  
  <text x="100" y="1280" fill="#666666" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">
      <tspan x="100" dy="0">与其担心孩子走弯路，</tspan>
      <tspan x="100" dy="50">不如先经营好自己的人生下半场。</tspan>
  </text>

</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Header -->
  <line x1="60" y1="120" x2="1020" y2="120" stroke="#B45B3E" stroke-width="2"/>
  <text x="60" y="100" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" font-weight="bold" letter-spacing="2">FAMILY &amp; GROWTH</text>
  <text x="1020" y="100" fill="#333333" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">01/04</text>
  
  <!-- Main Title -->
  <text x="60" y="240" fill="#333333" font-family="PingFang SC, sans-serif" font-size="96" font-weight="bold" letter-spacing="-2">与青春期孩子的</text>
  <text x="60" y="360" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="96" font-weight="bold" letter-spacing="-2">和解之路</text>
  
  <text x="60" y="480" fill="#666666" font-family="PingFang SC, sans-serif" font-size="36" line-spacing="10">
      <tspan x="60" dy="0">一场充满勇气</tspan>
      <tspan x="60" dy="50">与智慧的修行</tspan>
  </text>
  
  <!-- Collage Section: 1 Big Left, 2 Small Right -->
  <!-- Large Image Left: Parent watching child (symbolic) -->
  <rect x="60" y="600" width="620" height="740" fill="#E0DCD9"/>
  <text x="370" y="950" fill="#999999" font-family="PingFang SC, sans-serif" font-size="32" text-anchor="middle">Image: Watching Child walk away</text>
  
  <!-- Sticker on Large Image -->
  <g transform="rotate(-5, 150, 1100)">
      <rect x="150" y="1050" width="220" height="70" rx="35" fill="#FFE14D" stroke="white" stroke-width="4"/>
      <text x="260" y="1095" fill="#333333" font-family="PingFang SC, sans-serif" font-size="36" font-weight="bold" text-anchor="middle">尊重成长</text>
  </g>

  <!-- Small Image Top Right: Messy Desk (Individuality) -->
  <rect x="710" y="600" width="310" height="355" fill="#D6D2CF"/>
  <text x="865" y="770" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">Image: Vibrant/Messy Desk</text>

  <!-- Small Image Bottom Right: Personal Item (Privacy) -->
  <rect x="710" y="985" width="310" height="355" fill="#CAC7C4"/>
  <text x="865" y="1160" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">Image: Diary/Headphones</text>
  
  <!-- Signature -->
  <text x="1020" y="1400" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">@砂糖宝贝 Shatang Baobei</text>

</svg>

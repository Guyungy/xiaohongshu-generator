<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Page Number -->
  <text x="1020" y="100" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">02/04</text>
  
  <!-- Title Section -->
  <text x="60" y="180" fill="#333333" font-family="PingFang SC, sans-serif" font-size="64" font-weight="bold">01. 不是塑造，而是“允许”</text>
  
  <!-- Main Image with "Stickers" -->
  <rect x="60" y="240" width="960" height="500" fill="#E0DCD9"/>
  <text x="540" y="490" fill="#999999" font-family="PingFang SC, sans-serif" font-size="32" text-anchor="middle">Image: Teenager Silhouette / Growth</text>
  
  <!-- Stickers -->
  <g transform="rotate(-5, 900, 300)">
    <rect x="800" y="270" width="160" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="880" y="310" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">有棱角</text>
  </g>
  
  <g transform="rotate(5, 120, 650)">
    <rect x="60" y="620" width="160" height="60" rx="30" fill="#FFE14D" stroke="white" stroke-width="4"/>
    <text x="140" y="660" fill="#333333" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">有锋芒</text>
  </g>

  <!-- Body Text -->
  <text x="60" y="800" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" line-spacing="10">
      <tspan x="60" dy="0">我们总想把孩子雕刻成“理想的作品”，</tspan>
      <tspan x="60" dy="60">却忘了他是是一个有血有肉的人。</tspan>
      <tspan x="60" dy="60">青春期的叛逆，</tspan>
      <tspan x="60" dy="60">其实是他在笨拙地宣告独立。</tspan>
  </text>
  
  <!-- Bottom Box (The Insight) -->
  <rect x="60" y="1150" width="960" height="200" fill="none" stroke="#B45B3E" stroke-width="2"/>
  
  <!-- Icon in box -->
  <text x="100" y="1220" font-size="40">🌱</text>
  <text x="160" y="1220" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">砂糖宝贝的感悟：</text>
  
  <text x="100" y="1280" fill="#666666" font-family="PingFang SC, sans-serif" font-size="28" font-weight="bold">
      <tspan x="100" dy="0">真正看见孩子，不是看他多完美，</tspan>
      <tspan x="100" dy="50">而是接纳那些暂时的“不完美”。</tspan>
  </text>

</svg>

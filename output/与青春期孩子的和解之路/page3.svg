<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F7F3F0"/>
  
  <!-- Page Number -->
  <text x="1020" y="100" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="end">03/04</text>
  
  <!-- Title Section -->
  <text x="60" y="180" fill="#333333" font-family="PingFang SC, sans-serif" font-size="64" font-weight="bold">02. 纠结 vs 智慧</text>
  
  <!-- Comparison Cards Area -->
  <rect x="60" y="280" width="960" height="400" fill="#F0EBE8"/> <!-- Subtle bg for card area -->
  
  <!-- Left Card: Looking for Ideals (Anxiety) -->
  <rect x="110" y="330" width="400" height="300" fill="#FFFFFF"/>
  <text x="310" y="400" font-size="60" text-anchor="middle">🔍</text>
  <text x="310" y="460" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">寻找理想</text>
  <text x="310" y="520" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">盯着缺点、</text>
  <text x="310" y="560" fill="#999999" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">甚至想要重塑</text>
  
  <!-- Right Card: Watching Growth (Wisdom) -->
  <rect x="570" y="330" width="400" height="300" fill="#EAE0DA"/> <!-- Slightly darker/warmer -->
  <text x="770" y="400" font-size="60" text-anchor="middle">👀</text>
  <text x="770" y="460" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">目送成长</text>
  <text x="770" y="520" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">尊重选择、</text>
  <text x="770" y="560" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">哪怕背影蹒跚</text>

  <!-- Body Text -->
  <text x="60" y="800" fill="#333333" font-family="PingFang SC, sans-serif" font-size="32" line-spacing="10">
      <tspan x="60" dy="0">纠结的父母，手里拿着刻刀，</tspan>
      <tspan x="60" dy="50">总想削去孩子身上那些“不顺眼”的地方。</tspan>
      <tspan x="60" dy="70">而<tspan fill="#B45B3E" font-weight="bold">智慧的父母</tspan>，手里拿着灯盏，</tspan>
      <tspan x="60" dy="50">只是照亮他前行的路，</tspan>
      <tspan x="60" dy="50">告诉他：“去吧，我在。”</tspan>
  </text>
  
  <!-- Bottom Quote Lines -->
  <line x1="60" y1="1100" x2="1020" y2="1100" stroke="#E0DCD9" stroke-width="2"/>
  <text x="60" y="1180" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="36" font-weight="bold">“目送”</text>
  <text x="60" y="1250" fill="#B45B3E" font-family="PingFang SC, sans-serif" font-size="36" font-weight="bold">是父母一场充满勇气与智慧的修行。</text>

</svg>

<svg width="4320" height="1440" viewBox="0 0 4320 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Page 1 -->
    <g transform="translate(0, 0)">
        <rect x="0" y="0" width="1080" height="1440" fill="#F5F5F7"/>
        <rect x="60" y="60" width="960" height="100" rx="30" fill="#1A1A1A"/>
        <text x="100" y="120" font-family="sans-serif" font-size="36" fill="#F5A623" font-weight="bold">张姐深度观察</text>
        <text x="80" y="300" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">原来文化自信，</text>
        <text x="80" y="400" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">是这么教出来的！</text>
        <rect x="80" y="450" width="12" height="60" fill="#4A90E2" rx="6"/>
        <text x="110" y="490" font-family="sans-serif" font-size="28" fill="#666666">打破传统教育的壁垒</text>
    </g>

    <!-- Page 2 -->
    <g transform="translate(1080, 0)">
        <rect x="0" y="0" width="1080" height="1440" fill="#F5F5F7"/>
        <rect x="60" y="60" width="960" height="100" rx="30" fill="#1A1A1A"/>
        <text x="100" y="120" font-family="sans-serif" font-size="36" fill="#F5A623" font-weight="bold">张姐深度观察</text>
        <text x="80" y="300" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">传统与国际的碰撞</text>
        <rect x="80" y="350" width="12" height="60" fill="#F5A623" rx="6"/>
        <text x="110" y="390" font-family="sans-serif" font-size="28" fill="#666666">文化自信的培养，你还在原地踏步吗？</text>

        <rect x="80" y="500" width="920" height="250" rx="30" fill="#FFFFFF"/>
        <rect x="100" y="520" width="12" height="40" fill="#4A90E2" rx="6"/>
        <text x="130" y="550" font-family="sans-serif" font-size="36" fill="#1A1A1A" font-weight="bold">是空洞的口号，还是深刻的理解？</text>
        <text x="100" y="620" font-family="sans-serif" font-size="28" fill="#1A1A1A">在全球化背景下，如何培养孩子的文化自信，</text>
        <text x="100" y="660" font-family="sans-serif" font-size="28" fill="#1A1A1A">成为家长们普遍关注的焦点。</text>
        <text x="100" y="700" font-family="sans-serif" font-size="28" fill="#1A1A1A">仅仅是学习古诗词，真的能让孩子拥有文化自信吗？</text>
    </g>

    <!-- Page 3 -->
    <g transform="translate(2160, 0)">
        <rect x="0" y="0" width="1080" height="1440" fill="#F5F5F7"/>
        <rect x="60" y="60" width="960" height="100" rx="30" fill="#1A1A1A"/>
        <text x="100" y="120" font-family="sans-serif" font-size="36" fill="#F5A623" font-weight="bold">张姐深度观察</text>
        <text x="80" y="300" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">广州耀华的独到之处</text>
        <rect x="80" y="350" width="12" height="60" fill="#4A90E2" rx="6"/>
        <text x="110" y="390" font-family="sans-serif" font-size="28" fill="#666666">浸润式教育，文化自信内化生长</text>

        <rect x="80" y="500" width="920" height="400" rx="30" fill="#FFFFFF"/>
        <rect x="100" y="520" width="12" height="40" fill="#F5A623" rx="6"/>
        <text x="130" y="550" font-family="sans-serif" font-size="36" fill="#1A1A1A" font-weight="bold">深度融合，实践体验</text>
        <text x="100" y="620" font-family="sans-serif" font-size="28" fill="#1A1A1A">广州耀华国际教育学校，以其独特的浸润式教育模式，</text>
        <text x="100" y="660" font-family="sans-serif" font-size="28" fill="#1A1A1A">将中国传统文化与国际视野深度融合。</text>
        <text x="100" y="700" font-family="sans-serif" font-size="28" fill="#1A1A1A">孩子们不仅学习国学经典，更在多元文化环境中实践和体验，</text>
        <text x="100" y="740" font-family="sans-serif" font-size="28" fill="#1A1A1A">真正做到文化自信的内化与生长。</text>
    </g>

    <!-- Page 4 -->
    <g transform="translate(3240, 0)">
        <rect x="0" y="0" width="1080" height="1440" fill="#F5F5F7"/>
        <rect x="60" y="60" width="960" height="100" rx="30" fill="#1A1A1A"/>
        <text x="100" y="120" font-family="sans-serif" font-size="36" fill="#F5A623" font-weight="bold">张姐深度观察</text>
        <text x="80" y="300" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">培养孩子文化自信，</text>
        <text x="80" y="400" font-family="sans-serif" font-size="72" fill="#1A1A1A" font-weight="bold">从选择对的学校开始</text>
        <rect x="80" y="450" width="12" height="60" fill="#4A90E2" rx="6"/>
        <text x="110" y="490" font-family="sans-serif" font-size="28" fill="#666666">根植中国文化，面向世界成长</text>

        <rect x="80" y="600" width="920" height="350" rx="30" fill="#FFFFFF"/>
        <rect x="100" y="620" width="12" height="40" fill="#F5A623" rx="6"/>
        <text x="130" y="650" font-family="sans-serif" font-size="36" fill="#1A1A1A" font-weight="bold">不仅仅是学习，更是认同与表达</text>
        <text x="100" y="720" font-family="sans-serif" font-size="28" fill="#1A1A1A">文化自信不是空洞的口号，</text>
        <text x="100" y="760" font-family="sans-serif" font-size="28" fill="#1A1A1A">而是源于对自身文化的深刻理解和认同，</text>
        <text x="100" y="800" font-family="sans-serif" font-size="28" fill="#1A1A1A">以及在全球舞台上自信表达的能力。</text>
        <text x="100" y="860" font-family="sans-serif" font-size="28" fill="#1A1A1A">广州耀华，为孩子提供了一个根植于中国文化、</text>
        <text x="100" y="900" font-family="sans-serif" font-size="28" fill="#1A1A1A">面向世界的成长平台。</text>
        <text x="100" y="940" font-family="sans-serif" font-size="28" fill="#4A90E2" font-weight="bold">让孩子在文化交流中，找到属于自己的身份认同与价值。</text>
    </g>
</svg>

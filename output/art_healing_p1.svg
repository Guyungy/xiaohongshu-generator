<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .main-text { font-family: 'PingFang SC', sans-serif; fill: #111111; }
            .accent-text { font-family: 'PingFang SC', sans-serif; fill: #20C997; } /* Updated accent color */
            .eng-text { font-family: 'Arial', sans-serif; fill: #111111; }
            .bg-white { fill: #FFFFFF; }
            .line-stroke { stroke: #111111; stroke-width: 2; }
            .placeholder-rect { fill: none; stroke: #AAAAAA; stroke-width: 1; stroke-dasharray: 4 2; }
            .placeholder-text { font-family: 'PingFang SC', sans-serif; font-size: 18; fill: #AAAAAA; }
        </style>
    </defs>

    <rect width="600" height="800" class="bg-white"/>

    <!-- Column Header -->
    <text x="300" y="40" text-anchor="middle" font-size="20" class="eng-text">RESIDENT ARTIST LOG</text>
    <line x1="150" y1="50" x2="450" y2="50" class="line-stroke"/>

    <!-- P1 Title -->
    <text x="300" y="280" text-anchor="middle" font-size="40" font-weight="bold" class="main-text">画到万物都消失，又复生：</text>
    <text x="300" y="340" text-anchor="middle" font-size="36" class="main-text">这不只是一场艺术，更是疗愈</text>

    <!-- P1 Subtitle/Question -->
    <text x="300" y="480" text-anchor="middle" font-size="28" class="accent-text">心轮的低语：你听见了吗？</text> <!-- Accent color applied -->
    <line x1="180" y1="490" x2="420" y2="490" class="accent-text" stroke="#20C997"/> <!-- Accent color applied -->

    <!-- Image Placeholder -->
    <rect x="100" y="550" width="400" height="180" class="placeholder-rect"/>
    <text x="300" y="640" text-anchor="middle" class="placeholder-text">📷 建议放：一只手轻抚水彩颜料，色彩柔和，或抽象的漩涡图案。</text>
    
    <!-- Footer -->
    <text x="550" y="770" text-anchor="end" font-size="18" class="main-text">01 / 05</text>
</svg>
<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .main-text { font-family: 'PingFang SC', sans-serif; fill: #111111; }
            .accent-text { font-family: 'PingFang SC', sans-serif; fill: #20C997; } /* Updated accent color */
            .eng-text { font-family: 'Arial', sans-serif; fill: #111111; }
            .bg-white { fill: #FFFFFF; }
            .line-stroke { stroke: #111111; stroke-width: 2; }
            .placeholder-rect { fill: none; stroke: #AAAAAA; stroke-width: 1; stroke-dasharray: 4 2; }
            .placeholder-text { font-family: 'PingFang SC', sans-serif; font-size: 18; fill: #AAAAAA; }
        </style>
    </defs>

    <rect width="600" height="800" class="bg-white"/>

    <!-- Column Header -->
    <text x="300" y="40" text-anchor="middle" font-size="20" class="eng-text">RESIDENT ARTIST LOG</text>
    <line x1="150" y1="50" x2="450" y2="50" class="line-stroke"/>

    <!-- P2 Title -->
    <text x="300" y="100" text-anchor="middle" font-size="28" font-weight="bold" class="main-text">在忙碌中，我们丢失了与心轮的连接</text>

    <!-- Content Text -->
    <g class="main-text" font-size="22">
        <text x="50" y="160">现代社会，快节奏的生活让我们疲惫不堪。我们常常</text>
        <text x="50" y="190">被外界的喧嚣裹挟，习惯了压抑真实的情感，假装坚</text>
        <text x="50" y="220">强。长此以往，心底的连接逐渐被割裂：</text>
        <text x="50" y="250">“孤独缺爱”的感觉挥之不去，</text>
        <text x="50" y="280">“不配得感”让我们无法坦然接受爱，</text>
        <text x="50" y="310">过分的敏感或冷漠成了保护色，</text>
        <text x="50" y="340">我们甚至难以信任和敞开心扉。</text>
    </g>

    <!-- Contrast Table -->
    <g transform="translate(50, 380)">
        <rect x="0" y="0" width="500" height="200" class="line-stroke"/>
        <line x1="250" y1="0" x2="250" y2="200" class="line-stroke"/>
        <line x1="0" y1="50" x2="500" y2="50" class="line-stroke"/>
        <text x="125" y="30" text-anchor="middle" font-size="20" font-weight="bold" class="main-text">社会现状 (Social Status Quo)</text>
        <text x="375" y="30" text-anchor="middle" font-size="20" font-weight="bold" class="accent-text">心轮平衡 (Heart Chakra Balance)</text> <!-- Accent color applied -->

        <text x="125" y="90" text-anchor="middle" font-size="18" class="main-text">过分敏感/冷漠, 缺乏信任</text>
        <text x="125" y="120" text-anchor="middle" font-size="18" class="main-text">低频显化</text>

        <text x="375" y="90" text-anchor="middle" font-size="18" class="accent-text">慈悲、联结、宽恕</text> <!-- Accent color applied -->
        <text x="375" y="120" text-anchor="middle" font-size="18" class="accent-text">内心平和, 与世界合一</text> <!-- Accent color applied -->
    </g>

    <!-- Image Placeholder -->
    <rect x="100" y="600" width="400" height="150" class="placeholder-rect"/>
    <text x="300" y="675" text-anchor="middle" class="placeholder-text">📷 建议放：现代都市人表情麻木的侧写，或人群中孤独的背影。</text>
    
    <!-- Footer -->
    <text x="550" y="770" text-anchor="end" font-size="18" class="main-text">02 / 05</text>
</svg>
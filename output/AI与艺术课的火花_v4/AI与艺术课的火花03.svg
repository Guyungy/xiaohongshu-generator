<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1440" fill="white"/>
<rect x="50" y="50" width="980" height="1340" stroke="black" stroke-width="2"/>

<!-- Header -->
<text x="80" y="100" font-family="sans-serif" font-size="28" font-weight="bold" fill="black">一堂“茶染课”，如何点亮AI时代的生命美育？</text>
<line x1="80" y1="120" x2="1000" y2="120" stroke="#FF4500" stroke-width="2"/>

<!-- Diagram -->
<g id="flowchart">
    <!-- Step 1 -->
    <rect x="100" y="200" width="880" height="150" stroke="black" stroke-width="1" rx="10"/>
    <text x="120" y="240" font-family="sans-serif" font-size="28" font-weight="bold" fill="black">1. 具象之美：材料的生命对话</text>
    <text x="120" y="280" font-family="sans-serif" font-size="22" fill="#333">以普洱茶为媒介，感受茶与布料的交织，</text>
    <text x="120" y="310" font-family="sans-serif" font-size="22" fill="#333">体悟自然材料的生命力。</text>
    <path d="M540 350 L540 390" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="440" y="390" width="200" height="50" fill="none" stroke="#FF4500" stroke-width="1.5" />
    <text x="540" y="420" font-family="sans-serif" font-size="24" fill="#FF4500" text-anchor="middle">敬畏自然</text>

    <!-- Step 2 -->
    <rect x="100" y="500" width="880" height="150" stroke="black" stroke-width="1" rx="10"/>
    <text x="120" y="540" font-family="sans-serif" font-size="28" font-weight="bold" fill="black">2. 可持续性：设计与伦理的融合</text>
    <text x="120" y="580" font-family="sans-serif" font-size="22" fill="#333">思考“可持续的美”，培养面向未来的</text>
    <text x="120" y="610" font-family="sans-serif" font-size="22" fill="#333">伦理思辨能力。</text>
    <path d="M540 650 L540 690" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="390" y="690" width="300" height="50" fill="none" stroke="#FF4500" stroke-width="1.5" />
    <text x="540" y="720" font-family="sans-serif" font-size="24" fill="#FF4500" text-anchor="middle">可持续发展观</text>
    
    <!-- Step 3 -->
    <rect x="100" y="800" width="880" height="150" stroke="black" stroke-width="1" rx="10"/>
    <text x="120" y="840" font-family="sans-serif" font-size="28" font-weight="bold" fill="black">3. 非遗传承：文化基因的激活</text>
    <text x="120" y="880" font-family="sans-serif" font-size="22" fill="#333">在实践中激活对民族文化的认同感与</text>
    <text x="120" y="910" font-family="sans-serif" font-size="22" fill="#333">自豪感。</text>
    <path d="M540 950 L540 990" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="390" y="990" width="300" height="50" fill="none" stroke="#FF4500" stroke-width="1.5" />
    <text x="540" y="1020" font-family="sans-serif" font-size="24" fill="#FF4500" text-anchor="middle">文化认同与创新</text>
</g>

<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
</defs>

<!-- Footer -->
<text x="540" y="1300" font-family="monospace" font-size="24" fill="black" text-anchor="middle">...</text>
</svg>

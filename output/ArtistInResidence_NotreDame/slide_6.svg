<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Conclusion | 结语</text>
  
  <!-- Big Quote Mark -->
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="200" fill="#FF4500" opacity="0.2">“</text>
  
  <!-- Quote Text -->
  <text x="150" y="350" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">Vivre (去爱)</text>
  <text x="150" y="430" font-family="Noto Sans SC, sans-serif" font-size="64" fill="#666666" font-weight="normal">pour celui qu'on aime</text>
  
  <line x1="150" y1="480" x2="800" y2="480" stroke="#FF4500" stroke-width="2"/>
  
  <text x="150" y="550" font-family="Noto Sans SC, sans-serif" font-size="48" fill="#333333">为爱人而活</text>
  <text x="150" y="620" font-family="Noto Sans SC, sans-serif" font-size="48" fill="#333333">爱得比人性更深</text>
  
  <text x="600" y="700" font-family="Noto Sans SC, sans-serif" font-size="36" fill="#333333">— Esmeralda "Vivre"</text>
  
  <!-- Visual: The Rose Window (Abstract) -->
  <g transform="translate(540, 1000)">
    <circle cx="0" cy="0" r="200" stroke="black" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="50" stroke="#FF4500" stroke-width="2" fill="none"/>
    <path d="M0 -200 V200 M-200 0 H200" stroke="black" stroke-width="1"/>
    <path d="M-141 -141 L141 141 M-141 141 L141 -141" stroke="black" stroke-width="1"/>
    <!-- Abstract fragments -->
    <path d="M0 -100 L 50 -150 M 0 100 L -50 150" stroke="#FF4500" stroke-width="2"/>
  </g>

  <!-- Final Call to Action -->
  <text x="540" y="1280" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle">愿我们的孩子，在成为一个“有用的人”之前，</text>
  <text x="540" y="1330" font-family="Noto Sans SC, sans-serif" font-size="32" fill="#FF4500" text-anchor="middle" font-weight="bold">先做一个“懂爱的人”。</text>

  <!-- Footer -->
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">驻校艺术家手记 @ 上海耀中耀华</text>
  <text x="1000" y="1390" font-family="Arial, sans-serif" font-size="24" fill="black" text-anchor="end">2026.01</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5E5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1440" fill="white"/>
  <rect width="1080" height="1440" fill="url(#grid)"/>
  
  <!-- Main Content Box -->
  <rect x="100" y="150" width="880" height="1000" fill="white" stroke="black" stroke-width="6"/>
  
  <!-- Interior Layout - Header -->
  <rect x="140" y="190" width="800" height="400" fill="black"/>
  <text x="540" y="320" font-family="Noto Sans SC, sans-serif" font-size="60" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="4">SHANGHAI</text>
  <text x="540" y="420" font-family="Noto Sans SC, sans-serif" font-size="80" fill="#CCFF00" text-anchor="middle" font-weight="900">YEW WAH</text>
  <text x="540" y="520" font-family="Noto Sans SC, sans-serif" font-size="40" fill="white" text-anchor="middle" letter-spacing="2">GUBEI CAMPUS</text>
  
  <!-- Interior Layout - Body -->
  <rect x="140" y="630" width="800" height="480" fill="#CCFF00"/>
  <rect x="180" y="670" width="720" height="400" fill="none" stroke="black" stroke-width="4"/>
  
  <text x="540" y="780" font-family="Noto Sans SC, sans-serif" font-size="50" fill="black" text-anchor="middle" font-weight="bold">上海耀华古北校区</text>
  <line x1="340" y1="820" x2="740" y2="820" stroke="black" stroke-width="3"/>
  
  <text x="540" y="900" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" text-anchor="middle">
    <tspan x="540" dy="0">开放包容的艺术土壤</tspan>
    <tspan x="540" dy="60">国际化的学术氛围</tspan>
    <tspan x="540" dy="60">驻校艺术家项目的理想之地</tspan>
  </text>
  
  <!-- Footer section -->
  <rect x="0" y="1250" width="1080" height="190" fill="black"/>
  <line x1="0" y1="1250" x2="1080" y2="1250" stroke="#CCFF00" stroke-width="10"/>
  
  <text x="540" y="1330" font-family="Noto Sans SC, sans-serif" font-size="44" fill="white" text-anchor="middle" font-weight="bold">让才华在此绽放</text>
  <text x="540" y="1390" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#CCFF00" text-anchor="middle" letter-spacing="1">www.ywies-sh.com</text>
  
  <!-- Decorative elements -->
  <circle cx="980" cy="150" r="40" fill="black"/>
  <rect x="60" y="110" width="80" height="80" fill="#CCFF00" stroke="black" stroke-width="4"/>

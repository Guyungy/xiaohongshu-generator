<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1440" fill="#FFFBF5"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="60" y="160" width="960" height="1120" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <rect x="60" y="80" width="280" height="60" rx="30" fill="#E6D5C3"/>
  <text x="200" y="120" font-family="Noto Sans SC" font-weight="bold" font-size="28" fill="#B85C38" text-anchor="middle">🧠 心理复盘</text>

  <text x="140" y="240" font-family="Noto Sans SC" font-weight="bold" font-size="56" fill="#333333">为什么大脑会拒绝开机？</text>

  <!-- The Scale Illustration -->
  <g transform="translate(0, -50)">
    <line x1="200" y1="700" x2="880" y2="700" stroke="#333333" stroke-width="4"/>
    <polygon points="540,700 520,740 560,740" fill="#333333"/>
    
    <!-- Left Side: Pain (Heavy) -->
    <g transform="translate(150, 450)">
        <rect x="0" y="0" width="200" height="250" rx="10" fill="#B85C38" fill-opacity="0.9"/>
        <text x="100" y="60" font-family="Noto Sans SC" font-size="30" fill="#FFFFFF" text-anchor="middle">挫败感 📉</text>
        <text x="100" y="120" font-family="Noto Sans SC" font-size="30" fill="#FFFFFF" text-anchor="middle">被比较 👥</text>
        <text x="100" y="180" font-family="Noto Sans SC" font-size="30" fill="#FFFFFF" text-anchor="middle">无力感 🛑</text>
        <text x="100" y="290" font-family="Noto Sans SC" font-weight="bold" font-size="40" fill="#B85C38" text-anchor="middle">痛苦 (Pain)</text>
    </g>

    <!-- Right Side: Pleasure (Light) -->
    <g transform="translate(730, 200)">
        <rect x="0" y="300" width="120" height="100" rx="10" fill="#E6D5C3" fill-opacity="0.6"/>
        <text x="60" y="360" font-family="Noto Sans SC" font-size="24" fill="#666666" text-anchor="middle">成就</text>
        <text x="60" y="540" font-family="Noto Sans SC" font-weight="bold" font-size="32" fill="#999999" text-anchor="middle">快乐?</text>
    </g>
  </g>

  <!-- Checklist Box -->
  <rect x="120" y="780" width="840" height="480" rx="20" fill="#FFFBF5"/>
  <text x="160" y="840" font-family="Noto Sans SC" font-weight="bold" font-size="32" fill="#B85C38">🚨 隐形压力清单 (Invisible Stressors)</text>
  
  <text x="160" y="900" font-family="Noto Sans SC" font-size="28" fill="#444444">
    <tspan x="160" dy="0">很多时候，孩子感到的痛苦，我们习以为常：</tspan>
    <tspan x="160" dy="50">• **社交隔离**：在学校被孤立，或者融不进圈子。</tspan>
    <tspan x="160" dy="45">• **习得性无助**：努力了很久，依然被老师忽视或批评。</tspan>
    <tspan x="160" dy="45">• **虚假的自主权**：“你可以自己选，但必须选这个。”</tspan>
    <tspan x="160" dy="60">当 **痛苦 (Pain)** 长期大于 **奖赏 (Reward)**，</tspan>
    <tspan x="160" dy="45">大脑的 **多巴胺回路** 会彻底断裂。</tspan>
    <tspan x="160" dy="45">此时，**杏仁核 (Amygdala)** 会接管控制权，判定学校为：</tspan>
    <tspan x="160" dy="45" font-weight="bold" fill="#B85C38">“高危区域，立刻撤退。”</tspan>
  </text>

  <text x="540" y="1380" font-family="Noto Sans SC" font-size="24" fill="#999999" text-anchor="middle">@砂糖宝贝 · 2 / 6</text>
</svg>

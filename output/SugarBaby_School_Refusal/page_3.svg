<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1440" fill="#FFFBF5"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="60" y="160" width="960" height="1120" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <rect x="60" y="80" width="280" height="60" rx="30" fill="#E6D5C3"/>
  <text x="200" y="120" font-family="Noto Sans SC" font-weight="bold" font-size="28" fill="#B85C38" text-anchor="middle">🛡️ 保护机制</text>

  <text x="140" y="240" font-family="Noto Sans SC" font-weight="bold" font-size="56" fill="#333333">"罢工"，是为了</text>
  <text x="140" y="320" font-family="Noto Sans SC" font-weight="bold" font-size="56" fill="#B85C38">防止系统崩溃</text>

  <!-- Visual: System Shutdown -->
  <g transform="translate(290, 420)">
      <rect x="0" y="0" width="500" height="260" rx="20" fill="#333333"/>
      <text x="250" y="100" font-family="Arial" font-weight="bold" font-size="40" fill="#FF5555" text-anchor="middle">⚠️ SYSTEM OVERLOAD</text>
      <text x="250" y="160" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">Initiating Safe Mode...</text>
      <!-- Loading bar -->
      <rect x="100" y="200" width="300" height="10" rx="5" fill="#555555"/>
      <rect x="100" y="200" width="100" height="10" rx="5" fill="#FF5555"/>
  </g>

  <!-- Narrative Text: Inner Monologue -->
  <text x="140" y="780" font-family="Noto Sans SC" font-size="30" fill="#333333" width="800">
    <tspan x="140" dy="0">孩子躺在床上不起来，手机不离手。</tspan>
    <tspan x="140" dy="45">你以为他在贪图安逸，其实他的内心可能正在经历：</tspan>
  </text>
  
  <rect x="120" y="820" width="840" height="420" rx="20" fill="#F8F8F8" stroke="#EEEEEE"/>
  <text x="160" y="880" font-family="Noto Serif SC" font-style="italic" font-size="28" fill="#666666">
    <tspan x="160" dy="0">"我明天去不去学校？如果不去，爸妈会失望。"</tspan>
    <tspan x="160" dy="50">"如果去了，那些嘲笑的眼神我受得了吗？"</tspan>
    <tspan x="160" dy="50">"作业已经欠那一堆了，补不完了，我是个废物。"</tspan>
    <tspan x="160" dy="50">"好想睡过去，再也不用醒来面对这一切。"</tspan>
  </text>

  <rect x="120" y="1080" width="840" height="140" rx="20" fill="#E6D5C3" fill-opacity="0.3"/>
  <text x="160" y="1140" font-family="Noto Sans SC" font-weight="bold" font-size="28" fill="#B85C38">💡 砂糖解读：</text>
  <text x="160" y="1180" font-family="Noto Sans SC" font-size="28" fill="#444444">
    <tspan x="160" dy="0">这就是**【精神瘫痪】**。他的能量全部用来内耗了，</tspan>
    <tspan x="160" dy="40">已经没有哪怕 1% 的电量去支撑“起床”这个动作。</tspan>
  </text>

  <text x="540" y="1380" font-family="Noto Sans SC" font-size="24" fill="#999999" text-anchor="middle">@砂糖宝贝 · 3 / 6</text>
</svg>

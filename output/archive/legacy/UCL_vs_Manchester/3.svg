<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F9F9F7"/>
  
  <!-- Header Branding -->
  <rect width="1080" height="120" fill="#0F1E3C"/>
  <text x="540" y="75" fill="#D4AF37" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">每日一校 EduDaily</text>

  <!-- Manchester Section -->
  <rect x="80" y="200" width="920" height="1000" rx="20" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="2"/>
  <path d="M80 200 L1000 200 L1000 280 L80 280 Z" fill="#6B21A8"/>
  <text x="120" y="255" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Manchester</text>
  <text x="420" y="255" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="36" font-weight="bold">六边形战士 (Balanced Choice)</text>
  
  <g transform="translate(120, 320)">
      <text x="0" y="40" fill="#0369A1" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">💡 核心关键词：</text>
      <text x="0" y="90" fill="#333333" font-family="'PingFang SC', sans-serif" font-size="28">高性价比 (High ROI) + 极佳体验 (Experience)</text>
      
      <!-- Stats Grid -->
      <g transform="translate(0, 140)">
        <rect width="400" height="120" fill="#F3F4F6" rx="10"/>
        <text x="200" y="45" fill="#6B21A8" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">TOP 30-50</text>
        <text x="200" y="90" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">世界排名稳健</text>
        
        <rect x="420" y="0" width="400" height="120" fill="#F3F4F6" rx="10"/>
        <text x="620" y="45" fill="#047857" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">£25k-30k</text>
        <text x="620" y="90" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">学费相对亲民</text>
      </g>
      
      <text x="0" y="320" fill="#0369A1" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">✅ 核心优势 (Pros)：</text>
      <text x="40" y="370" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 钱花得值：生活成本仅为伦敦 60%，住得好。</text>
      <text x="40" y="420" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 雇主青睐：最受英国 Top100 雇主欢迎大学之一。</text>
      <text x="40" y="470" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 体验丰富：足球、音乐、夜生活，这里是快乐老家。</text>

      <text x="0" y="550" fill="#991B1B" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">❌ 劝退理由 (Cons)：</text>
      <text x="40" y="600" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 班级规模大：部分热门专业几百人，很难被关注。</text>
      <text x="40" y="650" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 治安：像所有大城市一样，部分区域需注意安全。</text>
  </g>
  
  <g transform="translate(120, 1050)">
      <rect width="840" height="120" fill="#FEF3C7" rx="10"/>
      <text x="40" y="50" fill="#92400E" font-family="'PingFang SC', sans-serif" font-size="28" font-weight="bold">👉 耀华视角：</text>
      <text x="40" y="90" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="26">对于不追求极端学术压力的学生，曼大能提供更平衡的成长路径。</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1350" x2="980" y2="1350" stroke="#0F1E3C" stroke-width="1"/>
  <text x="960" y="1400" fill="#0F1E3C" font-family="Arial, sans-serif" font-size="24" text-anchor="end">03 / 05</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F9F9F7"/>
  
  <!-- Header Branding -->
  <rect width="1080" height="120" fill="#0F1E3C"/>
  <text x="540" y="75" fill="#D4AF37" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">每日一校 EduDaily</text>

  <!-- UCL Section -->
  <rect x="80" y="200" width="920" height="1000" rx="20" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="2"/>
  <path d="M80 200 L1000 200 L1000 280 L80 280 Z" fill="#0F1E3C"/>
  <text x="120" y="255" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">UCL</text>
  <text x="250" y="255" fill="#D4AF37" font-family="'PingFang SC', sans-serif" font-size="36" font-weight="bold">学术“高压锅” (The Pressure Cooker)</text>
  
  <g transform="translate(120, 320)">
      <text x="0" y="40" fill="#991B1B" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">⚠️ 误区打破：</text>
      <text x="0" y="90" fill="#333333" font-family="'PingFang SC', sans-serif" font-size="28">以为进了 UCL 就能躺平？这里是卷王集中营！</text>
      
      <!-- Stats Grid -->
      <g transform="translate(0, 140)">
        <rect width="400" height="120" fill="#F3F4F6" rx="10"/>
        <text x="200" y="45" fill="#0F1E3C" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">TOP 10</text>
        <text x="200" y="90" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">QS World Ranking</text>
        
        <rect x="420" y="0" width="400" height="120" fill="#F3F4F6" rx="10"/>
        <text x="620" y="45" fill="#991B1B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">£40k+</text>
        <text x="620" y="90" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">热门专业学费</text>
      </g>
      
      <text x="0" y="320" fill="#0369A1" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">✅ 核心优势 (Pros)：</text>
      <text x="40" y="370" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 顶级学术资源：全球最顶尖的教授和实验室。</text>
      <text x="40" y="420" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 伦敦就业网络：四大、投行、律所就在门口。</text>
      <text x="40" y="470" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• G5 光环：回国落户、考公、进国企的硬通货。</text>

      <text x="0" y="550" fill="#991B1B" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold">❌ 劝退理由 (Cons)：</text>
      <text x="40" y="600" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 贵：学费贵，房租更贵 (1.5-2倍于曼城)。</text>
      <text x="40" y="650" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 累：学术压力极大，Library 通宵是常态。</text>
      <text x="40" y="700" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="28">• 吵：身处伦敦市中心，没有传统封闭式校园。</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1350" x2="980" y2="1350" stroke="#0F1E3C" stroke-width="1"/>
  <text x="960" y="1400" fill="#0F1E3C" font-family="Arial, sans-serif" font-size="24" text-anchor="end">02 / 05</text>
</svg>

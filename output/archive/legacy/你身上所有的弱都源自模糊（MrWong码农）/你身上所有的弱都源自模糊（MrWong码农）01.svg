<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .bg{fill:#F8FAFC;}
      .card{fill:#FFFFFF;stroke:#E5E7EB;stroke-width:2;}
      .accent{fill:#E0F2FE;}
      .h1{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:900;font-size:74px;fill:#0F172A;}
      .h1s{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:900;font-size:64px;fill:#0F172A;}
      .h2{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:800;font-size:34px;fill:#0F172A;}
      .p{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:600;font-size:34px;fill:#0F172A;}
      .m{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:500;font-size:24px;fill:#475569;}
      .mono{font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace;font-weight:800;font-size:22px;fill:#0F172A;}
      .foot{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:700;font-size:24px;fill:#0F172A;}
      .dot{fill:#10B981;}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="1600"/>

  <rect class="card" x="70" y="70" width="1060" height="170" rx="28"/>
  <circle cx="135" cy="155" r="40" fill="#1D9BF0" opacity="0.18"/>
  <text x="205" y="148" class="h2">Mr Wong是码农</text>
  <text x="205" y="188" class="m">// 先讲人话，再用代码 · 2026-03-17</text>
  <text x="1010" y="188" class="m">01 / 06</text>

  <rect x="70" y="270" width="1060" height="140" rx="28" class="accent"/>
  <text x="110" y="355" class="h1">你身上所有的弱，都源自模糊</text>

  <rect class="card" x="70" y="440" width="1060" height="890" rx="28"/>
  <text x="110" y="520" class="mono">// Checklist</text>
  <circle cx="125" cy="590" r="8" class="dot"/>
  <text x="150" y="600" class="p">不是你不努力，是目标太糊</text>
  <circle cx="125" cy="682" r="8" class="dot"/>
  <text x="150" y="692" class="p">不是钱不够，是规则不清</text>
  <circle cx="125" cy="774" r="8" class="dot"/>
  <text x="150" y="784" class="p">不是关系差，是边界不明</text>
  <circle cx="125" cy="866" r="8" class="dot"/>
  <text x="150" y="876" class="p">把“差不多”变成“可执行”</text>
  <circle cx="125" cy="958" r="8" class="dot"/>
  <text x="150" y="968" class="p">家庭上升，要靠清晰的SOP</text>

  <rect x="70" y="1360" width="1060" height="170" rx="28" class="card"/>
  <text x="110" y="1430" class="mono">// 桐乡耀华</text>
  <text x="110" y="1488" class="foot">桐乡耀华STEM启发：方法先于答案｜过程可视化｜任务可执行</text>
</svg>

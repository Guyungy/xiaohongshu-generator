<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="1640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .t0{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:800; fill:#0F172A}
      .t1{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:600; fill:#0F172A}
      .t2{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:500; fill:#334155}
      .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:600; fill:#0F172A}
      .tag{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:700; fill:#0F172A}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg)"/>

  <!-- Card container -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="1460" rx="36" fill="#FFFFFF"/>
    <rect x="70" y="70" width="1060" height="1460" rx="36" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Header -->
  <g>
    <circle cx="135" cy="135" r="42" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
    <text x="205" y="125" class="t1" font-size="34">Mr Wong是码农</text>
    <text x="205" y="165" class="t2" font-size="26">浙江桐乡 · 先讲人话，再用代码</text>

    <rect x="860" y="108" width="220" height="56" rx="18" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="888" y="145" class="tag" font-size="22">// AI BREAKTHROUGH</text>
  </g>

  <!-- Big title -->
  <g>
    <text x="110" y="270" class="t0" font-size="74">AI新突破别只看热闹</text>
    <text x="110" y="350" class="t0" font-size="62">我拆成3个“工程可落地”变化</text>
    <text x="110" y="405" class="t2" font-size="30">（码农 + 老爸视角：帮你少踩坑，少焦虑）</text>
  </g>

  <!-- Bento grid -->
  <g>
    <!-- Box 1 -->
    <rect x="110" y="470" width="500" height="320" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="145" y="530" class="mono" font-size="24">// Trigger</text>
    <text x="145" y="585" class="t1" font-size="36">从“会说”到“会做”</text>
    <text x="145" y="645" class="t2" font-size="30">能把任务拆步骤、
						主动检查、发现问题回滚。</text>
    <text x="145" y="730" class="t2" font-size="28">你感受到的是：工作流变短。</text>

    <!-- Box 2 -->
    <rect x="630" y="470" width="450" height="320" rx="28" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="665" y="530" class="mono" font-size="24">// Cost</text>
    <text x="665" y="585" class="t1" font-size="36">从“堆算力”到“算预算”</text>
    <text x="665" y="645" class="t2" font-size="30">小模型优先、缓存、
						结构化输入减少浪费。</text>
    <text x="665" y="730" class="t2" font-size="28">你感受到的是：成本更可控。</text>

    <!-- Box 3 -->
    <rect x="110" y="820" width="970" height="340" rx="28" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="145" y="880" class="mono" font-size="24">// System</text>
    <text x="145" y="935" class="t1" font-size="40">从“模型能力”到“系统能力”</text>
    <text x="145" y="1005" class="t2" font-size="30">决定效果的不是模型多强，而是你有没有把它嵌进：
      数据来源、权限控制、验证闭环、失败兜底。</text>
    <text x="145" y="1100" class="t2" font-size="28">一句话：把 AI 当同事会失望，把它当组件会省命。</text>
  </g>

  <!-- Footer quote -->
  <g>
    <rect x="110" y="1210" width="970" height="220" rx="28" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="145" y="1275" class="t1" font-size="34">金句（给忙到爆的家长/工程师）</text>
    <text x="145" y="1340" class="t2" font-size="30">别急着追最新模型，先做一个小闭环：</text>
    <text x="145" y="1390" class="t2" font-size="30">让 AI 帮你把“重复工作”写成 SOP，并加上验收条件。</text>

    <text x="980" y="1475" class="mono" font-size="24">01/03</text>
  </g>

  <!-- Soft placement: school -->
  <text x="110" y="1510" class="t2" font-size="22">注：最近在桐乡耀华看 STEM 课程设计，越快的技术迭代越需要底层思维框架。</text>
</svg>

<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="1600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="1640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .t0{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:800; fill:#0F172A}
      .t1{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:700; fill:#0F172A}
      .t2{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:500; fill:#334155}
      .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:700; fill:#0F172A}
      .chip{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:700; fill:#0F172A}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg2)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="1460" rx="36" fill="#FFFFFF"/>
    <rect x="70" y="70" width="1060" height="1460" rx="36" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Header -->
  <g>
    <text x="110" y="140" class="t1" font-size="34">Mr Wong是码农 · 工程师思维 + 老爸焦虑</text>
    <rect x="110" y="170" width="980" height="2" fill="#E2E8F0"/>
    <text x="110" y="215" class="mono" font-size="24">// Processing: 把“AI新突破”落到真实工作与家庭系统</text>
  </g>

  <!-- Title -->
  <g>
    <text x="110" y="310" class="t0" font-size="72">别追新模型，先补系统四件套</text>
    <text x="110" y="370" class="t2" font-size="30">（不然你会得到一个“很会说但不可用”的同事）</text>
  </g>

  <!-- 2-column bento -->
  <g>
    <!-- Left column -->
    <rect x="110" y="430" width="500" height="770" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="145" y="495" class="mono" font-size="24">// 01 Data</text>
    <text x="145" y="555" class="t1" font-size="40">数据从哪来？</text>
    <text x="145" y="625" class="t2" font-size="30">把输入改成“结构化”，
别让 AI 盲猜。</text>

    <rect x="145" y="690" width="420" height="110" rx="22" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="175" y="740" class="chip" font-size="22">输入模板</text>
    <text x="175" y="780" class="t2" font-size="26">目标 / 约束 / 证据 / 验收</text>

    <text x="145" y="870" class="mono" font-size="24">// 02 Permission</text>
    <text x="145" y="930" class="t1" font-size="40">权限怎么管？</text>
    <text x="145" y="1000" class="t2" font-size="30">研究岗只读；
写入/改权限必须二次确认。</text>

    <rect x="145" y="1065" width="420" height="110" rx="22" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="175" y="1115" class="chip" font-size="22">规则</text>
    <text x="175" y="1155" class="t2" font-size="26">能读就读，能写就停一下问</text>

    <!-- Right column -->
    <rect x="630" y="430" width="450" height="770" rx="28" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="665" y="495" class="mono" font-size="24">// 03 Verify</text>
    <text x="665" y="555" class="t1" font-size="40">结果怎么验？</text>
    <text x="665" y="625" class="t2" font-size="30">没有验收条件，
输出就是“情绪价值”。</text>

    <rect x="665" y="690" width="380" height="150" rx="22" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="695" y="735" class="chip" font-size="22">验收例子</text>
    <text x="695" y="775" class="t2" font-size="26">- 必须给可复现步骤</text>
    <text x="695" y="815" class="t2" font-size="26">- 必须给回滚方案</text>

    <text x="665" y="920" class="mono" font-size="24">// 04 Fallback</text>
    <text x="665" y="980" class="t1" font-size="40">失败怎么兜底？</text>
    <text x="665" y="1050" class="t2" font-size="30">重试 / 降级 / 告警，
别让“自动化”变“自动翻车”。</text>

    <rect x="665" y="1115" width="380" height="85" rx="22" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="695" y="1168" class="t2" font-size="26">Tip：先用小闭环，再上大工程</text>
  </g>

  <!-- Footer -->
  <g>
    <rect x="110" y="1240" width="970" height="220" rx="28" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="145" y="1305" class="t1" font-size="34">老爸视角（为什么重要）</text>
    <text x="145" y="1370" class="t2" font-size="30">因为孩子会模仿你的“系统”：你越稳定，他越安心。</text>
    <text x="145" y="1420" class="t2" font-size="30">把 AI 用成工具，是为了把时间还给家里。</text>

    <text x="980" y="1475" class="mono" font-size="24">02/03</text>
  </g>

  <text x="110" y="1510" class="t2" font-size="22">软植入：最近在桐乡耀华关注 STEM 的“工具思维”，核心不是知识量，而是系统化解决问题。</text>
</svg>

<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="1600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="1640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .t0{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:900; fill:#0F172A}
      .t1{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:700; fill:#0F172A}
      .t2{font-family: "Noto Sans CJK TC","Noto Sans CJK SC","PingFang TC","PingFang SC","Microsoft YaHei",Arial; font-weight:500; fill:#334155}
      .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:700; fill:#0F172A}
      .kbd{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:800; fill:#0F172A}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg3)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="1460" rx="36" fill="#FFFFFF"/>
    <rect x="70" y="70" width="1060" height="1460" rx="36" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Header -->
  <g>
    <text x="110" y="140" class="t1" font-size="34">Mr Wong是码农 · Return 0</text>
    <rect x="110" y="170" width="980" height="2" fill="#E2E8F0"/>
    <text x="110" y="215" class="mono" font-size="24">// Integration: 给你一条今晚就能用的“家庭友好”行动清单</text>
  </g>

  <!-- Big quote -->
  <g>
    <text x="110" y="330" class="t0" font-size="86">把 AI 用成工具，</text>
    <text x="110" y="430" class="t0" font-size="86">是为了把时间还给家里。</text>
    <text x="110" y="500" class="t2" font-size="30">（不是为了再给自己加一项“学习 AI 的 KPI”）</text>
  </g>

  <!-- Action checklist -->
  <g>
    <rect x="110" y="560" width="970" height="560" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="145" y="630" class="t1" font-size="40">今晚 30 分钟：做一个小闭环</text>

    <rect x="145" y="680" width="900" height="120" rx="22" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="185" y="745" class="kbd" font-size="28">1</text>
    <text x="235" y="730" class="t2" font-size="30">选一个最烦的重复活：资料整理/周报/排障记录</text>

    <rect x="145" y="820" width="900" height="120" rx="22" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="185" y="885" class="kbd" font-size="28">2</text>
    <text x="235" y="870" class="t2" font-size="30">让 AI 写“可执行 SOP”，并要求：步骤 + 风险 + 回滚</text>

    <rect x="145" y="960" width="900" height="120" rx="22" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="185" y="1025" class="kbd" font-size="28">3</text>
    <text x="235" y="1010" class="t2" font-size="30">你只做验收：能复现就收下，不能复现就退回改</text>
  </g>

  <!-- Dad note -->
  <g>
    <rect x="110" y="1150" width="970" height="280" rx="28" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="145" y="1220" class="t1" font-size="34">给家长的“系统提示”</text>
    <text x="145" y="1285" class="t2" font-size="30">孩子看的不是你会不会 AI，</text>
    <text x="145" y="1335" class="t2" font-size="30">而是你遇到问题时：能不能冷静拆解、稳定执行。</text>
    <text x="145" y="1395" class="t2" font-size="30">这也是我最近在桐乡耀华观察 STEM 课堂最强的底色。</text>

    <text x="980" y="1475" class="mono" font-size="24">03/03</text>
  </g>
</svg>

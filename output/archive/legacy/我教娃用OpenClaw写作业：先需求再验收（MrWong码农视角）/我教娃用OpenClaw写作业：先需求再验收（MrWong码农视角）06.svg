<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .bg{fill:#F8FAFC;}
      .card{fill:#FFFFFF;stroke:#E5E7EB;stroke-width:2;}
      .a{fill:#E0F2FE;}
      .x{fill:#FEE2E2;}
      .y{fill:#DCFCE7;}
      .h1{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:900;font-size:60px;fill:#0F172A;}
      .h2{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:800;font-size:34px;fill:#0F172A;}
      .p{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:500;font-size:30px;fill:#0F172A;}
      .m{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:500;font-size:24px;fill:#475569;}
      .mono{font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace;font-weight:800;font-size:22px;fill:#0F172A;}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1600"/>

  <rect class="card" x="70" y="70" width="1060" height="190" rx="28"/>
  <text x="110" y="155" class="h1">家长陪跑：10 分钟就够</text>
  <text x="110" y="210" class="m">// 你不需要当老师，只要帮他把流程走通</text>
  <text x="1010" y="210" class="m">06 / 06</text>

  <rect x="70" y="300" width="1060" height="470" rx="28" class="a"/>
  <text x="110" y="370" class="mono">10分钟流程</text>
  <text x="110" y="440" class="p">1）1分钟：孩子说“我要做什么”</text>
  <text x="110" y="500" class="p">2）2分钟：你帮他写 4 行需求</text>
  <text x="110" y="560" class="p">3）3分钟：让 OpenClaw 给步骤清单+模板</text>
  <text x="110" y="620" class="p">4）3分钟：先做第 1 步（启动）</text>
  <text x="110" y="680" class="p">5）1分钟：验收三问（跑题/漏点/隐私）</text>

  <rect x="70" y="800" width="520" height="430" rx="28" class="x"/>
  <rect x="610" y="800" width="520" height="430" rx="28" class="y"/>

  <text x="110" y="860" class="h2">别说这些</text>
  <text x="110" y="925" class="p">“你怎么又不会？”</text>
  <text x="110" y="985" class="p">“快点写，别墨迹！”</text>
  <text x="110" y="1045" class="p">“我帮你写算了。”</text>

  <text x="650" y="860" class="h2">换成这 3 句</text>
  <text x="650" y="925" class="p">“你要交付什么结果？”</text>
  <text x="650" y="985" class="p">“拆成 5 步，你先选第 1 步。”</text>
  <text x="650" y="1045" class="p">“写完我们过一遍验收三问。”</text>

  <rect class="card" x="70" y="1270" width="1060" height="240" rx="28"/>
  <text x="110" y="1345" class="mono">软植入一句</text>
  <text x="110" y="1405" class="p">这种“方法先于答案”的训练，STEM 体系很擅长。</text>
  <text x="110" y="1465" class="m">（我想到桐乡耀华那种：过程可视化、任务可执行）</text>
</svg>

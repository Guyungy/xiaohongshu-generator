<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#F9F9F7"/>
  
  <!-- Header Branding -->
  <rect width="1080" height="120" fill="#0F1E3C"/>
  <text x="540" y="75" fill="#D4AF37" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">每日一校 EduDaily</text>

  <!-- Title Area: PUNCHY & ATTRACTIVE -->
  <text x="540" y="300" fill="#0F1E3C" font-family="'PingFang SC', sans-serif" font-size="96" font-weight="bold" text-anchor="middle">被牛剑拒了？</text>
  
  <!-- Subtitle / Hook -->
  <rect x="190" y="350" width="700" height="4" fill="#D4AF37"/>
  <text x="540" y="440" fill="#991B1B" font-family="'PingFang SC', sans-serif" font-size="64" font-weight="bold" text-anchor="middle">这所全英 TOP 5</text>
  <text x="540" y="520" fill="#0369A1" font-family="'PingFang SC', sans-serif" font-size="56" font-weight="bold" text-anchor="middle">才是真正的“捡漏王”</text>

  <!-- High Density Info Box 1 -->
  <g transform="translate(140, 600)">
    <rect width="800" height="120" rx="10" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="2"/>
    <text x="30" y="50" fill="#D4AF37" font-family="'PingFang SC', sans-serif" font-size="28" font-weight="bold"># 90% 家长不知道的真相</text>
    <text x="30" y="90" fill="#333333" font-family="'PingFang SC', sans-serif" font-size="24">除了哈利波特，它的学术实力吊打很多红砖名校</text>
  </g>

  <!-- High Density Info Box 2: 4 Majors -->
  <g transform="translate(140, 750)">
    <!-- Major 1 -->
    <rect x="0" y="0" width="380" height="200" rx="10" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="50" rx="10" fill="#0F1E3C"/>
    <text x="190" y="35" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="28" text-anchor="middle" font-weight="bold">考古学 Archaeology</text>
    <text x="190" y="100" fill="#991B1B" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" font-weight="bold">TOP 3</text>
    <text x="190" y="150" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">仅次于剑桥/UCL</text>

    <!-- Major 2 -->
    <rect x="420" y="0" width="380" height="200" rx="10" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="1"/>
    <rect x="420" y="0" width="380" height="50" rx="10" fill="#0F1E3C"/>
    <text x="610" y="35" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="28" text-anchor="middle" font-weight="bold">地理学 Geography</text>
    <text x="610" y="100" fill="#991B1B" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" font-weight="bold">TOP 15</text>
    <text x="610" y="150" fill="#555555" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">极高的科研产出</text>

    <!-- Major 3 -->
    <rect x="0" y="220" width="380" height="200" rx="10" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="1"/>
    <text x="190" y="270" fill="#0F1E3C" font-family="'PingFang SC', sans-serif" font-size="28" text-anchor="middle" font-weight="bold">法学 Law</text>
    <text x="190" y="320" fill="#333333" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">Magic Circle Target</text>
    <rect x="90" y="350" width="200" height="40" rx="20" fill="#F3F4F6"/>
    <text x="190" y="378" fill="#0369A1" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">LNAT 27+ 刚需</text>

    <!-- Major 4 -->
    <rect x="420" y="220" width="380" height="200" rx="10" fill="#FFFFFF" stroke="#0F1E3C" stroke-width="1"/>
    <text x="610" y="270" fill="#0F1E3C" font-family="'PingFang SC', sans-serif" font-size="28" text-anchor="middle" font-weight="bold">商科 Business</text>
    <text x="610" y="320" fill="#333333" font-family="'PingFang SC', sans-serif" font-size="24" text-anchor="middle">Triple Accreditation</text>
    <rect x="510" y="350" width="200" height="40" rx="20" fill="#F3F4F6"/>
    <text x="610" y="378" fill="#0369A1" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">CFA 课程匹配</text>
  </g>

  <!-- Bottom CTA -->
  <line x1="140" y1="1200" x2="940" y2="1200" stroke="#D4AF37" stroke-width="2"/>
  <text x="540" y="1250" fill="#0F1E3C" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="bold" text-anchor="middle">一篇搞定：录取数据 + 课程解析 + 避坑指南</text>

  <!-- Date -->
  <text x="540" y="1320" fill="#666666" font-family="Georgia, serif" font-size="24" text-anchor="middle">2026.01.27</text>

  <!-- Footer -->
  <line x1="100" y1="1350" x2="980" y2="1350" stroke="#0F1E3C" stroke-width="1"/>
  <text x="960" y="1400" fill="#0F1E3C" font-family="Arial, sans-serif" font-size="24" text-anchor="end">01 / 05</text>
</svg>

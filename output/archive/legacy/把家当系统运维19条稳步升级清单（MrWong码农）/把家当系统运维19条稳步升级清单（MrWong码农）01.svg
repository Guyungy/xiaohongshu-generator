  <text x="650" y="755" class="m">技能/流程/可复用能力</text>

  <text x="110" y="950" class="mono">// 风控SLA</text>
  <text x="110" y="1015" class="p">先保底，再加速</text>
  <text x="110" y="1075" class="m">储蓄/风险限流/保障了解</text>

  <text x="650" y="950" class="mono">// 关系运维</text>

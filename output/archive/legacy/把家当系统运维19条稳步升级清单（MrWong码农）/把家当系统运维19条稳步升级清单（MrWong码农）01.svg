  <text x="90" y="500" class="m">家庭上升≠鸡血，是可执行的 SOP / Checklist</text>

  <rect x="70" y="570" width="520" height="300" rx="28" class="a"/>
  <rect x="610" y="570" width="520" height="300" rx="28" class="b"/>
  <rect x="70" y="890" width="520" height="300" rx="28" class="c"/>
  <rect x="610" y="890" width="520" height="300" rx="28" class="d"/>

  <text x="110" y="630" class="mono">// 路线图</text>
  <text x="110" y="695" class="p">短期/长期目标对齐</text>
  <text x="110" y="755" class="m">避免各跑各的分支</text>

  <text x="650" y="630" class="mono">// 资产模块</text>

<path d="M40 40H1040V1400H40V40Z" stroke="black" stroke-width="8"/>
<text x="80" y="120" font-family="Noto Sans SC" font-weight="900" font-size="80" fill="black">05 Why Students Watch</text>
<rect x="80" y="160" width="920" height="600" fill="#333333"/>
<text x="540" y="400" font-family="Noto Sans SC" font-weight="bold" font-size="80" fill="white" text-anchor="middle">为什么</text>
<text x="540" y="500" font-family="Noto Sans SC" font-weight="bold" font-size="80" fill="#FF4500" text-anchor="middle">[国际艺术高中]</text>
<text x="540" y="600" font-family="Noto Sans SC" font-weight="bold" font-size="80" fill="white" text-anchor="middle">必须要看？</text>
<path d="M100 800H980" stroke="white" stroke-width="4"/>
<text x="100" y="900" font-family="Noto Sans SC" font-weight="bold" font-size="50" fill="#333333">拒绝形式主义</text>
<text x="100" y="960" font-family="Noto Sans SC" font-size="40" fill="#666666">很多学生做作品集只会模仿风格，不懂背后的逻辑。</text>
<text x="100" y="1050" font-family="Noto Sans SC" font-weight="bold" font-size="50" fill="#333333">建立批判性思维</text>
<text x="100" y="1110" font-family="Noto Sans SC" font-size="40" fill="#666666">Robert Hughes教会我们：</text>
<text x="100" y="1170" font-family="Noto Sans SC" font-size="40" fill="#666666">不要盲目崇拜大师，要敢于质疑权威。</text>
<rect x="80" y="1250" width="920" height="120" fill="#FF4500"/>
<text x="540" y="1310" font-family="Noto Sans SC" font-weight="bold" font-size="40" fill="white" text-anchor="middle">驻校艺术家 · 课程推荐</text>
<text x="540" y="1350" font-family="Noto Sans SC" font-size="30" fill="white" text-anchor="middle">让艺术不仅是技法，更是观念</text>

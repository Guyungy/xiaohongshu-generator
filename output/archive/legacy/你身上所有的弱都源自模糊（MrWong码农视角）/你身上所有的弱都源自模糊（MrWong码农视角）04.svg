<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .bg{fill:#F8FAFC;}
      .card{fill:#FFFFFF;stroke:#E5E7EB;stroke-width:2;}
      .a{fill:#ECFDF5;}
      .b{fill:#FFF7ED;}
      .h1{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:900;font-size:66px;fill:#0F172A;}
      .h2{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:800;font-size:34px;fill:#0F172A;}
      .p2{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:550;font-size:28px;fill:#0F172A;}
      .m{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei";font-weight:500;font-size:24px;fill:#475569;}
      .mono{font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace;font-weight:800;font-size:22px;fill:#0F172A;}
      .tag{font-family:"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace;font-weight:800;font-size:18px;fill:#334155;}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1600"/>

  <rect class="card" x="70" y="70" width="1060" height="170" rx="28"/>
  <text x="110" y="150" class="h2">Mr Wong是码农</text>
  <text x="110" y="190" class="m">// translate abstract goals into executable steps</text>
  <text x="1010" y="190" class="m">04 / 06</text>

  <text x="90" y="320" class="h1">把“更好”翻译成动作</text>
  <text x="90" y="385" class="m">最有效的第一步：写成 4 行需求</text>

  <rect x="70" y="450" width="1060" height="620" rx="28" class="a"/>
  <text x="110" y="525" class="mono">// 4 行需求模板（孩子也能写）</text>
  <text x="110" y="605" class="p2">1）我现在要完成的任务是：______</text>
  <text x="110" y="665" class="p2">2）做到什么算完成（验收标准）：______</text>
  <text x="110" y="725" class="p2">3）边界/限制（字数/格式/必须包含/禁区）：______</text>
  <text x="110" y="785" class="p2">4）截止时间/时长预算：______</text>
  <text x="110" y="865" class="m">写完这 4 行，模糊会明显退散，注意力会回到“下一步”。</text>

  <rect x="70" y="1110" width="1060" height="320" rx="28" class="b"/>
  <text x="110" y="1185" class="mono">// 家长一句话话术</text>
  <text x="110" y="1255" class="p2">今晚别问“写完了吗”，问：</text>
  <text x="110" y="1315" class="p2">“第一步是什么？做到什么算完成？”</text>
  <text x="110" y="1385" class="tag">TIP: 先把路铺出来，再谈速度。</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Insight | 关系美学</text>
  <text x="1000" y="100" font-family="Arial, sans-serif" font-size="24" fill="black" text-anchor="end">Relational Aesthetics</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="56" fill="black" font-weight="bold" letter-spacing="-1">那根线，也是一种语言</text>
  
  <!-- Main Concept -->
  <text x="80" y="320" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">这不仅是编织，更是一次社会心理学实验。</text>
  <text x="80" y="360" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">在Maria Lai的艺术中，布条的每一个**打结方式**</text>
  <text x="80" y="400" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333" font-weight="bold">都暗示了人与人之间真实的、微妙的关系。</text>

  <!-- Diagram: Knots and Bows -->
  
  <!-- 1. The Bow (Love) -->
  <g transform="translate(140, 500)">
    <circle cx="100" cy="100" r="80" stroke="black" stroke-width="2" fill="none"/>
    <!-- Abstract Bow Icon -->
    <path d="M60 100 C 60 70, 90 70, 100 100 C 110 70, 140 70, 140 100 C 140 130, 110 130, 100 100" stroke="#FF4500" stroke-width="4" fill="none"/>
    <path d="M100 100 L 70 140 M 100 100 L 130 140" stroke="#FF4500" stroke-width="4"/>
    <text x="100" y="220" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle" font-weight="bold">蝴蝶结</text>
    <text x="100" y="260" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">象征：爱与分享</text>
  </g>

  <!-- 2. The Knot (Friendship) -->
  <g transform="translate(420, 500)">
    <circle cx="100" cy="100" r="80" stroke="black" stroke-width="2" fill="none"/>
    <!-- Abstract Knot Icon -->
    <circle cx="90" cy="100" r="20" stroke="black" stroke-width="3" fill="none"/>
    <circle cx="110" cy="100" r="20" stroke="black" stroke-width="3" fill="none"/>
    <text x="100" y="220" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle" font-weight="bold">死结</text>
    <text x="100" y="260" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">象征：友谊与稳固</text>
  </g>

  <!-- 3. The Taut Line (Conflict) -->
  <g transform="translate(700, 500)">
    <circle cx="100" cy="100" r="80" stroke="black" stroke-width="2" fill="none"/>
    <!-- Taut Line Icon -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="black" stroke-width="4"/>
    <text x="100" y="220" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle" font-weight="bold">绷紧的线</text>
    <text x="100" y="260" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">象征：矛盾与张力</text>
  </g>

  <!-- Mid-page Divider -->
  <line x1="80" y1="850" x2="1000" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Reflection -->
  <rect x="80" y="900" width="920" height="350" fill="#F9F9F9" stroke="none"/>
  <rect x="80" y="900" width="10" height="350" fill="#FF4500"/> <!-- Accent Bar -->
  
  <text x="130" y="950" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">教育的深层反思</text>
  
  <text x="130" y="1020" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">我们教孩子画画，往往只教了“如何画满一张纸”，</text>
  <text x="130" y="1060" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">只在乎透视准不准，色彩对不对。</text>
  <text x="130" y="1120" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">却忘记教他们一个更重要的问题：</text>
  
  <text x="130" y="1180" font-family="Noto Sans SC, sans-serif" font-size="36" fill="#FF4500" font-weight="bold">“这根线，最终要连向谁？”</text>
  
  <text x="130" y="1240" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">艺术不是自我封闭的孤芳自赏，</text>
  <text x="130" y="1280" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">它是我们伸向他人、伸向世界的一根触角。</text>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">3 / 6</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5E5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1440" fill="white"/>
  <rect width="1080" height="1440" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="60" y="100" width="960" height="150" fill="black"/>
  <text x="540" y="195" font-family="Noto Sans SC, sans-serif" font-size="50" fill="white" text-anchor="middle" font-weight="bold">这里的风，也是灵感</text>

  <!-- Context Text Block -->
  <rect x="60" y="300" width="960" height="450" fill="white" stroke="black" stroke-width="4"/>
  <rect x="60" y="300" width="20" height="450" fill="#CCFF00"/>
  
  <text x="120" y="400" font-family="Noto Sans SC, sans-serif" font-size="40" font-weight="900" fill="black">远离喧嚣的留白</text>
  <text x="120" y="480" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#333" width="860">
    <tspan x="120" dy="0">艺术需要空间来呼吸。</tspan>
    <tspan x="120" dy="50">庆幸我们身处海边，远离市中心的拥挤与焦虑。</tspan>
    <tspan x="120" dy="50">校园里大片的草地、开阔的天空、</tspan>
    <tspan x="120" dy="50">以及随处可见的自然光，</tspan>
    <tspan x="120" dy="50">给了孩子们最奢侈的创作土壤。</tspan>
    <tspan x="120" dy="50">在这里，“慢下来”是一件自然而然的事。</tspan>
  </text>

  <!-- Visual Metaphor -->
  <rect x="60" y="850" width="960" height="400" fill="#F0F0F0"/>
  <text x="540" y="1050" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#999" text-anchor="middle">Photo Placeholder: Campus Lake/Open Studio</text>
  
  <text x="960" y="1300" font-family="Noto Sans SC, sans-serif" font-size="80" fill="#CCFF00" text-anchor="end" font-weight="900">SPACE</text>
  <text x="960" y="1380" font-family="Noto Sans SC, sans-serif" font-size="40" fill="black" text-anchor="end" font-weight="bold">TO CREATE</text>
</svg>

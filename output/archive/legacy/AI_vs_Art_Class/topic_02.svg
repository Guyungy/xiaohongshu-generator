<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1440" fill="white"/>
  
  <rect x="0" y="0" width="1080" height="200" fill="#CCFF00"/>
  <text x="60" y="140" font-family="Noto Sans SC, sans-serif" font-size="140" font-weight="900" fill="black">THE GAP</text>
  
  <rect x="60" y="250" width="960" height="1100" fill="black"/>
  
  <!-- Comparison Block 1 -->
  <text x="120" y="380" font-family="Noto Sans SC, sans-serif" font-size="60" font-weight="bold" fill="white">AI 生成只需 3 Sec</text>
  <text x="120" y="440" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#999">
    <tspan x="120" dy="0">Prompt 输入 -> 算力渲染 -> 完美图像</tspan>
    <tspan x="120" dy="50">结果：Pixel Perfect，但没有情感记忆。</tspan>
  </text>
  
  <line x1="120" y1="520" x2="960" y2="520" stroke="white" stroke-width="1" stroke-dasharray="10 10"/>

  <!-- Comparison Block 2 -->
  <text x="120" y="620" font-family="Noto Sans SC, sans-serif" font-size="60" font-weight="bold" fill="#CCFF00">茶染需要 3 Hours</text>
  <text x="120" y="680" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#DDD">
    <tspan x="120" dy="0">煮水 -> 闻香 -> 浸泡 -> 等待 -> 漂洗 -> 晾晒</tspan>
    <tspan x="120" dy="50">结果：充满褶皱与瑕疵，但每一处肌理</tspan>
    <tspan x="120" dy="50">都记录了水的流动和手的温度。</tspan>
  </text>

  <!-- Density Added: Philosophical Block -->
  <rect x="120" y="850" width="840" height="400" fill="#222" stroke="white" stroke-width="2"/>
  <text x="160" y="930" font-family="Noto Sans SC, sans-serif" font-size="36" fill="white" font-weight="bold">"教育不仅是获取结果"</text>
  <text x="160" y="1000" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#AAA" width="760">
    <tspan x="160" dy="0">在这个万物皆可被“一键生成”的时代，</tspan>
    <tspan x="160" dy="50">过程本身的价值被无限压缩。</tspan>
    <tspan x="160" dy="50">然而，正是在那些看似低效的劳作中——</tspan>
    <tspan x="160" dy="50">在等待颜料变干的焦虑中，在修正失误的</tspan>
    <tspan x="160" dy="50">思考中，创造力才真正发生。</tspan>
    <tspan x="160" dy="80" fill="#CCFF00">我们坚持让孩子去走那条“慢路”。</tspan>
  </text>
</svg>

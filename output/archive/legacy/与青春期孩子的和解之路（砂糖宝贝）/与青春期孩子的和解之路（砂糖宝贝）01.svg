<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#F7F3F0}
      .ink{fill:#333333}
      .accent{fill:#B45B3E}
      .muted{fill:#6B6B6B}
      .hl{fill:#FFE14D}
      .tTitle{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial; font-weight:900;}
      .tH2{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial; font-weight:800;}
      .tBody{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial; font-weight:500;}
      .tMono{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-weight:700;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" class="bg"/>

  <!-- Header -->
  <text x="90" y="110" class="tMono muted" font-size="26">砂糖宝贝 · 上海临港家长 · 2026/03/03</text>
  <rect x="90" y="135" width="1020" height="3" class="accent" opacity="0.6"/>

  <!-- Title block -->
  <text x="90" y="250" class="tTitle ink" font-size="84">吵完别急着翻篇</text>
  <text x="90" y="340" class="tTitle ink" font-size="72">和青春期孩子的「修复」</text>
  <text x="90" y="415" class="tBody muted" font-size="34">不是把孩子“捏成理想”，而是把关系带回安全与尊重。</text>

  <!-- Intro paragraph (3-5 lines) -->
  <text x="90" y="500" class="tBody ink" font-size="32">
    <tspan x="90" dy="0">很多家庭的吵架，不是因为“问题太大”，</tspan>
    <tspan x="90" dy="52">而是因为吵完以后，没有人知道怎么把关系修回来。</tspan>
    <tspan x="90" dy="52">沉默、冷战、翻旧账，会让距离越拉越远。</tspan>
    <tspan x="90" dy="52">今天这三页，我想给你一个温柔但清醒的修复顺序。</tspan>
  </text>

  <!-- Key bullets -->
  <g transform="translate(90 730)">
    <rect x="0" y="0" width="1020" height="360" rx="28" fill="#FFF" opacity="0.65"/>
    <text x="40" y="70" class="tH2 ink" font-size="40">先问自己一个问题：</text>
    <text x="40" y="130" class="tBody ink" font-size="32">• 你要的是“赢”，还是“关系继续走下去”？</text>
    <text x="40" y="190" class="tBody ink" font-size="32">• 青春期的棱角，常常是边界在长出来。</text>
    <text x="40" y="250" class="tBody ink" font-size="32">• 和解不是认输，是重新连接的入口。</text>
    <text x="40" y="310" class="tBody ink" font-size="32">• “目送”孩子成为自己，比“塑造理想”更勇敢。</text>
  </g>

  <!-- Quote -->
  <g transform="translate(90 1130)">
    <rect x="0" y="0" width="1020" height="160" rx="28" fill="#FFFFFF"/>
    <text x="40" y="62" class="tTitle accent" font-size="46">“修复不是把话说得更重，</text>
    <text x="40" y="120" class="tTitle accent" font-size="46">而是把心放回更近。”</text>
  </g>

  <!-- Collage (1+2) placeholder -->
  <g transform="translate(90 1320)">
    <rect x="0" y="0" width="520" height="210" rx="26" fill="#FFFFFF" opacity="0.85"/>
    <rect x="540" y="0" width="480" height="100" rx="26" fill="#FFFFFF" opacity="0.85"/>
    <rect x="540" y="110" width="480" height="100" rx="26" fill="#FFFFFF" opacity="0.85"/>

    <rect x="24" y="24" width="140" height="48" rx="24" class="hl"/>
    <text x="44" y="58" class="tMono ink" font-size="22">封面拼图位</text>

    <text x="24" y="130" class="tBody muted" font-size="26">你可以放：
孩子的背影 / 一张“空椅子”
/ 一杯水 / 一段路灯下散步</text>

    <text x="740" y="62" class="tBody muted" font-size="26">评论区：
你们上一次吵架后，
是怎么和好的？</text>
    <text x="740" y="170" class="tBody muted" font-size="26">回【模板】
我发3句话复盘卡</text>
  </g>

  <text x="1080" y="1570" class="tMono muted" font-size="22">01/03</text>
</svg>

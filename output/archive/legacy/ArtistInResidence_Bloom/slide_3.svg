<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Insight | 深度洞察</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">Looking vs Seeing</text>
  
  <!-- Quote Block -->
  <rect x="80" y="300" width="920" height="240" fill="#FAFAFA" stroke="none"/>
  <rect x="80" y="300" width="10" height="240" fill="#FF4500"/>
  <text x="130" y="360" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-style="italic">"Nobody sees a flower - really -</text>
  <text x="130" y="410" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-style="italic">it is so small it takes time -</text>
  <text x="130" y="460" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-style="italic" font-weight="bold">we haven't time."</text>
  <text x="750" y="500" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666">— Georgia O'Keeffe</text>

  <!-- Diagram: The Eye vs The Heart -->
  <g transform="translate(100, 600)">
    <!-- Path 1: Looking -->
    <g transform="translate(0, 0)">
       <text x="100" y="50" font-family="Arial, sans-serif" font-size="32" fill="#666666" font-weight="bold">Looking</text>
       <line x1="50" y1="80" x2="150" y2="80" stroke="#666666" stroke-width="2"/>
       
       <circle cx="100" cy="150" r="50" stroke="#666666" stroke-width="2" fill="none"/> <!-- Eye Icon -->
       <circle cx="100" cy="150" r="20" fill="#666666"/>
       
       <path d="M100 220 L 100 280" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
       
       <rect x="20" y="300" width="160" height="80" stroke="#666666" stroke-width="2" fill="none"/>
       <text x="100" y="350" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#666666" text-anchor="middle">大脑识别</text>
       <text x="100" y="420" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">扫描 (Scanning)</text>
    </g>

    <!-- Path 2: Seeing -->
    <g transform="translate(500, 0)">
       <text x="100" y="50" font-family="Arial, sans-serif" font-size="32" fill="#FF4500" font-weight="bold">Seeing</text>
       <line x1="50" y1="80" x2="150" y2="80" stroke="#FF4500" stroke-width="2"/>
       
       <circle cx="100" cy="150" r="50" stroke="#FF4500" stroke-width="4" fill="none"/> <!-- Eye Icon -->
       <circle cx="100" cy="150" r="20" fill="#FF4500"/>
       
       <path d="M100 220 L 100 280" stroke="#FF4500" stroke-width="4" marker-end="url(#arrow)"/>
       
       <path d="M100 300 L 180 380 L 100 460 L 20 380 Z" fill="#FF4500"/> <!-- Diamond/Heart abstract -->
       <text x="100" y="390" font-family="Noto Sans SC, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">心灵连接</text>
       <text x="100" y="500" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#FF4500" text-anchor="middle">共鸣 (Resonance)</text>
    </g>
  </g>

  <!-- Reflection -->
  <text x="80" y="1150" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">为什么O'Keeffe要把花画得那么巨大？</text>
  <text x="80" y="1200" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">她是在用巨大的尺寸，**强迫**你停下匆忙的脚步。</text>
  <text x="80" y="1250" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">这是一种视觉的暴力，也是一种温柔的挽留。</text>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">3 / 6</text>
</svg>

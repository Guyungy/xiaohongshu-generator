<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Context | 1998-2026</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">谁才是真正的“人”？</text>
  
  <!-- Narrative -->
  <rect x="80" y="320" width="920" height="280" stroke="black" stroke-width="1" fill="none"/>
  <text x="120" y="370" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">20年前，当Garou第一次嘶吼出《Danse Mon Esmeralda》，</text>
  <text x="120" y="410" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">我们只看到了一个悲伤的爱情故事。</text>
  <text x="120" y="460" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">20年后，重看这部剧，</text>
  <text x="120" y="500" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333">才发现它是一部残酷的**成人寓言**。</text>
  <text x="120" y="550" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#FF4500" font-weight="bold">它在拷问我们关于“文明”的定义。</text>

  <!-- Comparison Visual -->
  <g transform="translate(80, 650)">
    <!-- Frollo -->
    <rect x="0" y="0" width="440" height="500" fill="#FAFAFA" stroke="none"/>
    <text x="220" y="60" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold" text-anchor="middle">Frollo 主教</text>
    <line x1="50" y1="80" x2="390" y2="80" stroke="black" stroke-width="2"/>
    
    <text x="220" y="150" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">受人尊敬 (Respected)</text>
    <text x="220" y="200" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">饱读诗书 (Educated)</text>
    <text x="220" y="250" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">举止得体 (Civilized)</text>
    
    <text x="220" y="350" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">Result:</text>
    <text x="220" y="400" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-weight="bold" text-anchor="middle">毁灭欲 (Destruction)</text>
    
    <!-- Quasimodo -->
    <rect x="480" y="0" width="440" height="500" fill="#FFF0E6" stroke="none"/> <!-- Slight orange tint -->
    <text x="700" y="60" font-family="Noto Sans SC, sans-serif" font-size="36" fill="#FF4500" font-weight="bold" text-anchor="middle">Quasimodo 怪人</text>
    <line x1="530" y1="80" x2="870" y2="80" stroke="#FF4500" stroke-width="2"/>
    
    <text x="700" y="150" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">被遗弃 (Abandoned)</text>
    <text x="700" y="200" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">目不识丁 (Uneducated)</text>
    <text x="700" y="250" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#333333" text-anchor="middle">长相丑陋 (Monstrous)</text>
    
    <text x="700" y="350" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#666666" text-anchor="middle">Result:</text>
    <text x="700" y="400" font-family="Noto Sans SC, sans-serif" font-size="32" fill="#FF4500" font-weight="bold" text-anchor="middle">爱的能力 (To Love)</text>
  </g>
  
  <!-- Conclusion Line -->
  <text x="540" y="1250" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" text-anchor="middle" font-weight="bold">有些“文明”是围墙，有些“野蛮”是光。</text>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">2 / 6</text>
</svg>

<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">驻校艺术家手记</text>
  <text x="1000" y="100" font-family="Arial, sans-serif" font-size="24" fill="black" text-anchor="end">Warning</text>

  <!-- Title (2 Lines) -->
  <text x="80" y="350" font-family="Noto Sans SC, sans-serif" font-size="96" fill="black" font-weight="900" letter-spacing="-2">20年后的冷汗：</text>
  <text x="80" y="480" font-family="Noto Sans SC, sans-serif" font-size="96" fill="#FF4500" font-weight="900" letter-spacing="-2">别把孩子养成Frollo</text>

  <!-- Subtitle -->
  <rect x="80" y="560" width="700" height="60" fill="black"/>
  <text x="100" y="600" font-family="Noto Sans SC, sans-serif" font-size="32" fill="white" font-weight="bold">重看《巴黎圣母院》的教育警示</text>

  <!-- Visual: Frollo's Shadow vs Quasimodo -->
  <g transform="translate(100, 750)">
     <!-- Frollo: Rigid, tall, imposing shadow -->
     <path d="M100 600 L150 100 L350 100 L400 600" stroke="black" stroke-width="4" fill="none"/>
     <circle cx="250" cy="80" r="40" stroke="black" stroke-width="4" fill="none"/>
     <text x="180" y="300" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-weight="bold">完美 (Perfect)</text>
     <text x="180" y="350" font-family="Noto Sans SC, sans-serif" font-size="32" fill="black" font-weight="bold">虚伪 (Fake)</text>
     
     <!-- Separator Idea -->
     <line x1="500" y1="50" x2="500" y2="600" stroke="black" stroke-width="1" stroke-dasharray="10 10"/>

     <!-- Quasimodo: Curved, organic, warm -->
     <path d="M600 500 C 650 450, 750 450, 800 550" stroke="#FF4500" stroke-width="8" stroke-linecap="round" fill="none"/> <!-- Hunch -->
     <circle cx="680" cy="480" r="30" fill="#FF4500"/>
     <text x="650" y="300" font-family="Noto Sans SC, sans-serif" font-size="32" fill="#FF4500" font-weight="bold">真实 (Real)</text>
     <text x="650" y="350" font-family="Noto Sans SC, sans-serif" font-size="32" fill="#FF4500" font-weight="bold">去爱 (To Love)</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">上海耀中耀华国际教育</text>
  <text x="1000" y="1390" font-family="Arial, sans-serif" font-size="24" fill="black" text-anchor="end">YCYW</text>
</svg>

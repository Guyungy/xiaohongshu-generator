<svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1440" fill="#FFFFFF"/>
  
  <!-- Header -->
  <line x1="80" y1="120" x2="1000" y2="120" stroke="black" stroke-width="2"/>
  <text x="80" y="100" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black" font-weight="bold">The Value | 该怎么做</text>
  
  <!-- Title -->
  <text x="80" y="250" font-family="Noto Sans SC, sans-serif" font-size="64" fill="black" font-weight="bold">保护孩子的“怪物之心”</text>
  <text x="80" y="310" font-family="Noto Sans SC, sans-serif" font-size="30" fill="#666666">给家长的三个共情建议</text>
  
  <!-- Tips List -->
  <g transform="translate(80, 360)">
    
    <!-- Tip 1 -->
    <rect x="0" y="0" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="80" r="40" fill="#FF4500"/>
    <text x="80" y="95" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">1</text>
    
    <text x="160" y="70" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">关于“看见”</text>
    <text x="160" y="130" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">就像艾斯米拉达给卡西莫多的一口水。</text>
    <text x="160" y="170" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">告诉孩子，这世上最珍贵的超能力不是考第一名，</text>
    <text x="160" y="210" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">而是**看见那些在角落里的人**，</text>
    <text x="160" y="245" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#666666">并愿意递出一杯水。</text>

    <!-- Tip 2 -->
    <rect x="0" y="310" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="380" r="40" fill="black"/>
    <text x="80" y="395" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">2</text>
    
    <text x="160" y="360" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">关于“表达”</text>
    <text x="160" y="420" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">Frollo的悲剧在于无法面对真实的欲望。</text>
    <text x="160" y="460" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">鼓励孩子表达真实的情绪，哪怕是嫉妒或恐惧。</text>
    <text x="160" y="500" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">**情绪没有好坏，压抑才会扭曲。**</text>

    <!-- Tip 3 -->
    <rect x="0" y="620" width="920" height="260" stroke="black" stroke-width="1" fill="none"/>
    <circle cx="80" cy="690" r="40" fill="white" stroke="black" stroke-width="4"/>
    <text x="80" y="705" font-family="Arial, sans-serif" font-size="48" fill="black" text-anchor="middle" font-weight="bold">3</text>
    
    <text x="160" y="670" font-family="Noto Sans SC, sans-serif" font-size="36" fill="black" font-weight="bold">关于“不完美”</text>
    <text x="160" y="730" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">告诉孩子，你不需要像Frollo一样“正确”，</text>
    <text x="160" y="770" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">但你可以像卡西莫多一样“真实”。</text>
    <text x="160" y="810" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#333333">**真实的爱，是这个时代最硬通的货币。**</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1340" x2="1000" y2="1340" stroke="black" stroke-width="2"/>
  <text x="80" y="1390" font-family="Noto Sans SC, sans-serif" font-size="24" fill="black">5 / 6</text>
</svg>

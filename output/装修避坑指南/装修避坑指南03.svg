<svg width="1200" height="1600" viewBox="0 0 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="1600" fill="#F8FAFC"/>

<!-- Header -->
<g id="Header">
    <rect x="40" y="40" width="1120" height="80" rx="24" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="20" fill="#000000"/>
    <text x="112" y="92" font-family="monospace" font-size="24" fill="#0C0A09">
        Mr Wong是码农
    </text>
    <text x="960" y="92" font-family="monospace" font-size="24" fill="#64748B">
        // Return(0)
    </text>
</g>

<!-- Main Title -->
<text x="60" y="240" font-family="sans-serif" font-size="80" font-weight="bold" fill="#0C0A09">
    信任，也需要架构<tspan x="60" dy="1.2em">来保护</tspan>
</text>

<!-- Bento Box Grid -->
<g id="BentoGrid">
    <!-- Box 1: The Golden Rule -->
    <rect x="60" y="400" width="1080" height="500" rx="24" fill="#FFFFFF"/>
    <text x="100" y="480" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0C0A09">1. 金句：先小人，后君子</text>
    <text x="100" y="560" font-family="sans-serif" font-size="36" fill="#1E293B">
        "所有生意的本质，<tspan x="100" dy="1.5em">都是把一次性博弈</tspan><tspan x="100" dy="1.5em">变成多次合作。"</tspan>
    </text>
    <text x="500" y="800" text-anchor="middle" font-family="monospace" font-size="28" fill="#475569">
        ——沃伦·巴菲特 (的设计师)
    </text>

    <!-- Box 2: Practical Advice -->
    <rect x="60" y="940" width="1080" height="400" rx="24" fill="#FFFFFF"/>
    <text x="100" y="1000" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0C0A09">2. 行动建议：让工长帮你</text>
    <text x="100" y="1080" font-family="monospace" font-size="28" fill="#475569">
        靠谱的工长，让他推荐供应商。
    </text>
    <text x="100" y="1140" font-family="monospace" font-size="28" fill="#475569">
        ✓ 他们能赚点回扣，对你的项目更上心。
    </text>
    <text x="100" y="1200" font-family="monospace" font-size="28" fill="#475569">
        ✓ 他们推荐的人，都是多次合作，更可靠。
    </text>
     <text x="100" y="1260" font-family="monospace" font-size="24" fill="#94A3B8">
        (自己也要去比价，这是基本操作)
    </text>
</g>

<!-- Footer -->
<g id="Footer">
    <text x="60" y="1500" font-family="monospace" font-size="24" fill="#64748B">
        一个好的系统，胜过无数次说教
    </text>
    <text x="1100" y="1500" font-family="monospace" font-size="24" fill="#64748B">
        3 / 3
    </text>
</g>
</svg>

<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="1600" fill="#F8FAFC"/>

<!-- Header -->
<g id="Header">
    <rect x="40" y="40" width="1120" height="80" rx="24" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="20" fill="#000000"/>
    <text x="112" y="92" font-family="monospace" font-size="24" fill="#0C0A09">
        Mr Wong是码农
    </text>
    <text x="1000" y="92" font-family="monospace" font-size="24" fill="#64748B">
        // Topic
    </text>
</g>

<!-- Main Title -->
<text x="60" y="240" font-family="sans-serif" font-size="80" font-weight="bold" fill="#0C0A09">
    装修的坑，<tspan x="60" dy="1.2em">只有一个总开关</tspan>
</text>

<!-- Bento Box Grid -->
<g id="BentoGrid">
    <!-- Box 1: The Core Problem -->
    <rect x="60" y="400" width="1080" height="500" rx="24" fill="#FFFFFF"/>
    <g id="Problem Illustration">
        <text x="100" y="480" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0C0A09">1. 问题本质：一次性交易</text>
        <path d="M400 650 C400 550, 800 550, 800 650 C800 750, 400 750, 400 650 Z" fill="#FEE2E2"/>
        <text x="600" y="665" font-family="sans-serif" font-size="100" text-anchor="middle">😩</text>
        <text x="600" y="800" text-anchor="middle" font-family="monospace" font-size="28" fill="#991B1B">你的热情，别人的ATM</text>
    </g>
    <g id="MoneyBag">
        <rect x="550" y="550" width="100" height="80" fill="#FB923C"/>
        <circle cx="600" ccy="550" r="50" fill="#FB923C"/>
        <text x="600" y="590" font-size="40" text-anchor="middle" fill="white">¥</text>
    </g>

    <!-- Box 2: Why it fails -->
    <rect x="60" y="940" width="1080" height="400" rx="24" fill="#FFFFFF"/>
    <text x="100" y="1000" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0C0A09">2. 模式缺陷：无法“止损”</text>
    <text x="100" y="1080" font-family="monospace" font-size="28" fill="#475569" dy="0em">
        合同一签，钱一付，你就失去了主动权。
    </text>
    <text x="100" y="1080" font-family="monospace" font-size="28" fill="#475569" dy="1.5em">
        不管对方做得多差，你都很难换人。
    </text>
    <text x="100" y="1080" font-family="monospace" font-size="28" fill="#475569" dy="3em">
        唯一的博弈只剩下“拖”，但时间成本在你这边。
    </text>

    <path d="M900 1100 L 1000 1200 M 900 1200 L 1000 1100" stroke="#EF4444" stroke-width="10"/>

</g>

<!-- Footer -->
<g id="Footer">
    <text x="60" y="1500" font-family="monospace" font-size="24" fill="#64748B">
        装修不仅是美学，更是项目管理
    </text>
    <text x="1100" y="1500" font-family="monospace" font-size="24" fill="#64748B">
        1 / 3
    </text>
</g>
</svg>
